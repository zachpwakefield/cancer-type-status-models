# Follow-up analyses, fixed before any of them was computed.
#   subtype_regulators, subtype_site_probe   docs/SUBTYPE_METHODS.md D-46, D-47
#   cross_task                               docs/ACROSS_TASKS_METHODS.md D-48..D-51
#   msi_cis                                  docs/SUBTYPE_METHODS.md D-52 (added later the same day)
#   msi_long_tracts                          docs/SUBTYPE_METHODS.md D-53 (after D-52's results)
#   msi_a3ss_replication                     docs/SUBTYPE_METHODS.md D-54 (after D-53's results)
#   msi_robustness                           docs/SUBTYPE_METHODS.md D-55 (after D-54's results)
#   msi_dna                                  docs/SUBTYPE_METHODS.md D-56 (before any read was fetched)
#   brca_germline, brca_her2, brca_mutations docs/SUBTYPE_METHODS.md D-57..D-59 (BRCA follow-up)
#   brca_her2_uncapped                       docs/SUBTYPE_METHODS.md D-60 (after D-58's results)
#   msi_deletion_load, msi_frame_nmd,        docs/SUBTYPE_METHODS.md D-61..D-64 (MSI follow-up, after
#   msi_branchpoint, msi_germline_indels     D-52..D-56; docs/MSI_REPEATS_LITERATURE.md)
#
# Written 2026-10-12, after every model of the three tasks had been fitted and summarised, and
# before any analysis below was run. Nothing here refits a model or changes a label, a cohort, a
# feature or a threshold of the existing tasks: everything is computed from stored data, stored
# out-of-fold predictions and stored held-out SHAP values.
#
# What had already been seen when this file was written (so it could have shaped a prediction):
#   - the subtype results of results/SUBTYPE.md, including the leiomyosarcoma ACTN1/TPM1 events,
#     their direction in LMS, and the cross-family tables (histology model vs molecular class);
#   - the tumour-status regulator layer (BIOLOGY_METHODS D-18) and the pan-cancer site probe
#     (D-20), whose splicing views lost more accuracy than GEX when sites were held out;
#   - the cancer-type confusion tables at project level (e.g. ESCA <-> STAD, CESC <-> HNSC);
#   - the number of tissue-source sites per subtype class (label-only; used for the site rule).
# Not seen: splicing-factor expression by subtype class, any type or status probability broken
# down by subtype, any site-held-out subtype accuracy, any subtype exon's protein annotation.
#
# A prediction is "supported" when the difference is in the stated direction with BH q < 0.05
# in its family; "against" when it is in the opposite direction with q < 0.05; otherwise "not
# resolved". All tests are two-sided; the stated direction is the claim being checked.

subtype_regulators:                      # D-46 · scripts/37_subtype_regulators.py
  factors: biology.yaml regulators.splicing_factors       # the same 70 factors as D-18
  covariates: [stromal_genes, immune_genes]                # biology.yaml, as D-18
  scan:
    test_two_classes: mann_whitney
    test_more_classes: kruskal
    fdr_family: per cohort, over the factors measured in it
    effect: AUROC of each class against the rest of the cohort
  association:                           # as D-18, with subtype top events
    top_events_per_view: 50              # overall importance of the cohort's model
    views: [se, a3ss, a5ss, mxe, ri]
    n_background_events: 500
    rho: 0.3
    min_finite: 0.7
  predictions:
    - id: R1
      cohort: MESO
      gene: ESRP1
      higher_in: [Epithelioid]
      lower_in: [Biphasic]
      why: ESRP1/2 drive the epithelial splicing programme and are lost in EMT; biphasic
           tumours carry a sarcomatoid (mesenchymal) component
      source: Warzecha et al. 2009 Mol Cell 33:591; Warzecha et al. 2010 EMBO J 29:3286
    - id: R2
      cohort: MESO
      gene: ESRP2
      higher_in: [Epithelioid]
      lower_in: [Biphasic]
      source: as R1
    - id: R3
      cohort: HNSC_mRNA
      gene: ESRP1
      higher_in: [Atypical, Basal, Classical]
      lower_in: [Mesenchymal]
      why: the mesenchymal class is defined by EMT and stromal/immune genes
      source: Warzecha et al. 2010; TCGA 2015 Nature 517:576
    - id: R4
      cohort: SARC
      gene: PTBP1
      higher_in: [DDLPS, UPS, MFS]
      lower_in: [LMS]
      why: PTBP1 represses the smooth-muscle exons of ACTN1 and TPM1
      source: Southby et al. 1999 Mol Cell Biol 19:2699; Gooding et al. 1998 RNA 4:85
    - id: R5
      cohort: SARC
      gene: PTBP1
      event: "ENSG00000072110.15#chr14:68878457-68878523#-;68878988-68879069;68877081-68877240;68879961-68880108"
      event_name: ACTN1 mutually exclusive exons (MXE)
      claim: partial Spearman (PTBP1 log2 CPM, PSI), adjusting for class, stromal and immune
             scores, has the sign opposite to the LMS-minus-rest median PSI difference
      source: Southby et al. 1999
    - id: R6
      cohort: SARC
      gene: PTBP1
      event: "ENSG00000140416.23#chr15:63043705-63043831#+;63044026-63044152;63042757-63042943;63056984-63057118"
      event_name: TPM1 exons 2/3 (MXE)
      claim: as R5
      source: Gooding et al. 1998
  fdr_family_predictions: R1-R6 together

subtype_site_probe:                      # D-47 · scripts/38_subtype_site_probe.py
  pipeline: as BIOLOGY_METHODS D-20 (top-2,000 variance, median impute, standardise,
            L2 logistic regression C = 0.05, balanced classes; multinomial for > 2 classes)
  schemes: [case-grouped, site-held-out]   # StratifiedGroupKFold(5) by case / by TSS
  seeds: [0, 1, 2]
  views: all nine
  metric: balanced accuracy of the pooled out-of-fold calls, mean over seeds
  drop: case-grouped minus site-held-out
  min_sites_per_class: 5                 # else the cohort is not probed (SARC: MFS has 4)
  confounding: Cramer's V between TSS and class, from the task table (no model)
  predictions:
    - id: P1
      claim: in most probed cohorts the median drop of the 8 AS views exceeds the GEX drop
      test: sign test over cohorts
      why: D-20 found the splicing views more site-sensitive than GEX for neighbouring projects
    - id: P2
      claim: across cohorts, the drop rises with Cramer's V (Spearman > 0), for GEX and for the
             AS-view median separately
      why: a model can only lean on site where class and site go together

cross_task:                              # docs/ACROSS_TASKS_METHODS.md · scripts/40_cross_task.py
  models: [GEX, AS ensemble, GEX + AS]   # out-of-fold; AS ensemble = mean of the 8 AS views;
                                         # GEX + AS = 0.5 GEX + 0.5 AS ensemble (as D-23, D-40)
  gene_overlap:                          # D-48
    top_genes: 100                       # gene = its best feature (biology.gene_ranking)
    status: overall importance of the cancer's tumour-status model
    type: importance over the samples of the cancer's own class (cancer-type model)
    subtype: overall importance of the cohort's model
    universe: genes with a feature passing both tasks' pre-filters for that cancer / cohort
    test: hypergeometric; BH over all (pair, cohort, view)
    predictions:
      - id: G1
        claim: every task pair overlaps above chance (median fold enrichment > 1 over cohorts and views)
      - id: G2
        claim: for histology cohorts, subtype-type overlap exceeds subtype-status overlap
               (paired Wilcoxon on Jaccard over cohort x view)
        why: a histology class is a lineage, which the cancer-type models read; tumour status
             reads tumour-versus-normal programmes
  type_probability_by_subtype:           # D-49
    measure: per patient, the sum of the type model's out-of-fold probabilities over the target classes
    test: Mann-Whitney between the named subtype groups; effect AUROC; BH over predictions, per model
    predictions:
      - {id: T1, cohort: ESCA, targets: [HNSC, LUSC, CESC], higher_in: [Squamous], lower_in: [Adenocarcinoma],
         source: "TCGA 2017 Nature 541:169"}
      - {id: T2, cohort: ESCA, targets: [STAD], higher_in: [Adenocarcinoma], lower_in: [Squamous],
         source: "TCGA 2017 Nature 541:169"}
      - {id: T3, cohort: CESC, targets: [HNSC, LUSC], higher_in: [Squamous], lower_in: [Adenocarcinoma],
         source: "TCGA 2017 Nature 543:378"}
      - {id: T4, cohort: CESC, targets: [UCEC], higher_in: [Adenocarcinoma], lower_in: [Squamous],
         source: "TCGA 2017 Nature 543:378 (endometrial-like cervical cancers)"}
      - {id: T5, cohort: LGG_IDH, targets: [GBM], higher_in: [IDHwt], lower_in: [IDHmut-codel, IDHmut-non-codel],
         source: "Brat et al. 2015 NEJM 372:2481; Ceccarelli et al. 2016 Cell 164:550"}
      - {id: T6, cohort: BRCA_PAM50, targets: [OV], higher_in: [Basal], lower_in: [LumA, LumB, Her2, Normal-like],
         source: "TCGA 2012 Nature 490:61"}
      - {id: T7, cohort: UCEC_TCGA, targets: [OV, UCS], higher_in: [CN-high], lower_in: [POLE, MSI, CN-low],
         source: "TCGA 2013 Nature 497:67"}
      - {id: T8, cohort: UCEC, targets: [OV, UCS], higher_in: [Serous], lower_in: [Endometrioid],
         source: "TCGA 2013 Nature 497:67"}
      - {id: T9, cohort: MESO, targets: [SARC], higher_in: [Biphasic], lower_in: [Epithelioid],
         source: "WHO definition (sarcomatoid component); Hmeljak et al. 2018 Cancer Discov 8:1548"}
      - {id: T10, cohort: HNSC_HPV, targets: [CESC], higher_in: [HPV-positive], lower_in: [HPV-negative],
         source: "Pyeon et al. 2007 Cancer Res 67:4605"}
      - {id: T11, cohort: PCPG_mRNA, targets: [ACC], higher_in: [Cortical admixture],
         lower_in: [Kinase signaling, Pseudohypoxia, Wnt-altered],
         source: "Fishbein et al. 2017 Cancer Cell 31:181 (positive control: adrenal cortex in the sample)"}
      - {id: T12, cohort: STAD_TCGA, targets: [ESCA], higher_in: [CIN], lower_in: [MSI, GS, EBV],
         source: "TCGA 2017 Nature 541:169 (oesophageal adenocarcinoma resembles CIN gastric cancer)"}
      - {id: T13, cohort: STAD, targets: [COAD, READ], higher_in: [Intestinal], lower_in: [Diffuse],
         source: "Lauren 1965 Acta Pathol Microbiol Scand 64:31 (intestinal-type glands)"}
    descriptive: mean probability of every type class within every subtype class; the share of
                 each subtype class the type model calls another project, and which
  status_probability_by_subtype:         # D-50
    cohorts: subtype cohorts of the cancers with a tumour-status model
    measure: out-of-fold P(tumour) of the primary tumour
    test: Mann-Whitney between the named groups; BH over predictions, per model;
          Kruskal-Wallis per cohort (descriptive, BH over cohorts)
    predictions:
      - {id: S1, cohort: BRCA_PAM50, lower_in: [Normal-like], higher_in: [LumA, LumB, Her2, Basal],
         source: "Parker et al. 2009 J Clin Oncol 27:1160 (normal-like reflects normal-tissue content)"}
      - {id: S2, cohort: THCA, lower_in: [Follicular], higher_in: [Classical],
         source: "TCGA 2014 Cell 159:676 (RAS-like, follicular, most differentiated)"}
      - {id: S3, cohort: THCA, lower_in: [Classical], higher_in: [Tall cell],
         source: "TCGA 2014 Cell 159:676 (tall-cell-like cluster, lowest differentiation score)"}
      - {id: S4, cohort: STAD, lower_in: [Diffuse], higher_in: [Intestinal],
         source: "Lauren 1965 (diffuse type infiltrates as scattered cells in stroma)"}
      - {id: S5, cohort: STAD_TCGA, lower_in: [GS], higher_in: [CIN, MSI, EBV],
         source: "TCGA 2014 Nature 513:202 (GS enriched for diffuse histology)"}
      - {id: S6, cohort: BRCA, lower_in: [Lobular], higher_in: [Ductal],
         source: "histological definition (discohesive single-file infiltration)"}
    composition: within the tumours of each such cancer, Spearman of P(tumour) with the stromal and
                 the immune score (biology.yaml genes); predicted negative (C1)
  exon_protein_character:                # D-51
    sets: tumour status top SE exons and cancer-type top SE exons (as D-17), and the union of the
          top 100 SE events of every subtype cohort's model (overall importance)
    background: the same random 6,000 measured exons as D-17
    metrics: as D-17 (length divisible by 3; exact GENCODE exon; coding; Pfam/CDD domain,
             disordered region and TM helix among fully coding exons)
    prediction:
      - id: E1
        claim: subtype top exons are, like the other two tasks', more often divisible by 3, less often
               in a domain and more often in a disordered region than the background
        source: "Buljan et al. 2012 Mol Cell 46:871; Ellis et al. 2012 Mol Cell 46:884"

msi_cis:                                 # D-52 · scripts/42_msi_repeats.py
  # Written 2026-10-12, after results/SUBTYPE.md §8 and before any PSI value was read by repeat
  # class. Already seen when this section was written (so it could have shaped a prediction):
  #   - SUBTYPE.md §8 / U7: ten MSI events shared by UCEC, STAD and COAD, their direction (7 of 9
  #     loci less included in MSI), the POLE tumours' values on them, the immune and MLH1 checks;
  #   - the label counts below, and the PCR MSI status of the UCEC_TCGA POLE tumours (1 MSI-H);
  #   - the label-blind repeat annotation (`--only annotate`): the distribution of acceptor T-run
  #     lengths, set sizes per cohort, and that MRE11 exon 5 (88 nt, chr11:94479674-94479761) has
  #     a T11 acceptor run while HSPH1 exon 9 is not a cassette event of either SE matrix;
  #   - Jonchere et al. 2024 Genome Biol 25:210 (MSI at U2AF-binding polypyrimidine tracts ->
  #     exon skipping, colorectal only); Dorard et al. 2011 Nat Med 17:1283 (HSP110 T17);
  #     Giannini et al. 2002 EMBO Rep 3:248 (MRE11 T11 -> exon 5 skipping).
  # Not seen: any PSI by repeat class or by MSI status outside the ten U7 events, any score.
  cohorts: [UCEC_TCGA, STAD_TCGA, COAD_TCGA]          # subtype task tables, unchanged
  groups:
    MSI: label MSI (UCEC.MSI; GI.HM-indel)
    rest: every other class except POLE (UCEC CN-low + CN-high; STAD CIN + GS + EBV; COAD CIN + GS)
    POLE: UCEC_TCGA label POLE, without the PCR MSI-H tumour (TCGASubtype Subtype_other)
  exons:
    matrix: subtype SE matrix, features passing the cohort's pre-filter
    keep: finite PSI in >= 80% of the cohort and >= 10 patients of each compared group;
          acceptor window measurable (upstream intron >= 60 nt) with AG at -2,-1
  repeats:                               # sense strand, longest homopolymer run overlapping a window
    acceptor: positions -1..-50 of the upstream intron
    deep: positions -201..-400 of the upstream intron (intron >= 500 nt)
    R: acceptor T-run >= 10              # repeat exons
    B: acceptor T-run <= 5               # background exons
    R_deep: acceptor T-run <= 6 and deep T-run >= 10
    B_deep: acceptor T-run <= 5 and deep T-run <= 5
    dose_bins: [6-7, 8-9, 10-11, 12-13, ">=14"]
  score:
    percentile: per exon, PSI ranked over the cohort's patients (average ties, missing left out)
    sample_score: mean percentile over R minus the mean over B, B weighted to R's distribution over
                  deciles of the exon's cohort mean PSI (cancels the global PSI axis of D-24)
    exon_delta: mean percentile in MSI minus mean percentile in rest
  bootstrap: {reps: 2000, seed: 0, resample: patients within group}
  fdr_families:
    M: M1-M7, all cohorts together (19 tests)
    K: K1 over the cohorts
  predictions:
    - id: M1
      claim: in each cohort the sample score is lower in MSI than in rest (AUROC > 0.5)
      test: Mann-Whitney
      why: shortened acceptor poly-T tracts weaken the 3' splice site, so the exon is skipped
      source: "Jonchere et al. 2024 Genome Biol 25:210; Giannini et al. 2002; Dorard et al. 2011"
    - id: M2
      claim: across exons with an acceptor T-run >= 6, exon_delta falls as the run lengthens
             (partial Spearman < 0, adjusting for the cohort mean PSI)
      why: longer repeats slip more often in MMR-deficient cells
    - id: M3
      claim: as M2, also adjusting for the pyrimidine fraction of positions -1..-50
      why: separates repeat slippage from a trans change that tracks 3' splice-site strength
    - id: M4
      claim: the acceptor score separates MSI from rest better than the same score built from the
             deep window (R_deep vs B_deep) - AUROC difference > 0
      test: paired bootstrap; p = 2 x the smaller tail share (floor 1/2000)
      why: a repeat acts on the acceptor only inside the polypyrimidine tract / branch-point region
    - id: M5
      claim: UCEC_TCGA, the sample score is lower in MSI than in POLE (AUROC > 0.5)
      test: Mann-Whitney
      why: POLE tumours are hypermutated by base substitutions but mismatch-repair proficient, so
           their repeats are stable; expectation, not a verdict - POLE vs rest AUROC near 0.5
    - id: M6
      claim: the top 50 SE events of each cohort's MSI class (mean |SHAP| over MSI patients, D-38
             cache) carry an acceptor T-run >= 10 more often than the cohort's other exons
      test: Fisher exact (odds ratio > 1)
      why: if the cis route is real, the models that learned MSI from data will have used it
    - id: M7
      claim: for R exons measured in two cohorts, exon_delta minus the median exon_delta of B exons
             in the same mean-PSI decile correlates between the cohorts (Spearman > 0; 3 pairs)
      why: the same repeats are exposed in every MMR-deficient genome, whatever the organ
    - id: K1
      claim: MRE11 exon 5 (T11 acceptor) is less included in MSI than in rest, in each cohort
      test: Mann-Whitney on PSI
      source: "Giannini et al. 2002 EMBO Rep 3:248; Giannini et al. 2004 Oncogene 23:2640"
  exploratory:                           # reported as such, never as a verdict
    dose_auroc: the sample-score AUROC per dose bin (each bin's exons against B)
    share_explained: of exons less included in MSI (per-exon Mann-Whitney, BH q < 0.05 within the
                     cohort), the share with an acceptor T-run >= 10, against the share among all
    u7_events: the acceptor T-runs of the ten U7 events
    detector: the sample score as a label-free MSI detector (MSI vs every other patient) next to
              the subtype models' out-of-fold MSI AUROCs
    base_specificity: the same score from A-, C- and G-runs (A >= 10, C >= 8, G >= 8)
    donor: the same score from T-runs at +1..+50 of the downstream intron
    cn_low: UCEC MSI against CN-low only (both mostly endometrioid)
    pole_msi_h: where the PCR MSI-H POLE tumour falls
    frame: share of exons skipped in MSI with an acceptor T-run >= 10 whose length is not a
           multiple of 3 (skipping shifts the frame), against all R exons
    shared: R exons less included in MSI in all three cohorts, ranked

msi_long_tracts:                         # D-53 · scripts/42_msi_repeats.py --only tracts
  # Written 2026-10-12 after the D-52 results (results/subtype/msi_cis/) had been read, before the
  # relation below was computed. Prompted by two observations: the two U7 loci MORE included in
  # MSI (CCNDBP1, ANXA7) carry the longest acceptor T-runs of the U7 events (30 and 29 nt), and the
  # spread of exon_delta widens for runs >= 14 (dose_exon_delta.csv, both tails). Seen: those two
  # tables, the U7 events' runs, every D-52 prediction and exploratory table. Not seen: exon_delta
  # against baseline inclusion for any repeat set, or any table split by baseline PSI.
  hypothesis: a long U-tract is bound by hnRNP C, which competes with U2AF65 and represses the
              acceptor; shortening it in MSI can relieve repression (inclusion up) while a
              moderate tract that U2AF65 needs is weakened (inclusion down). Repressed exons have
              low baseline inclusion, so the MSI shift should depend on baseline PSI.
  source: "Zarnack et al. 2013 Cell 152:453 (hnRNP C vs U2AF65 at U-tracts, Alu exons)"
  sets: R and R_deep of msi_cis; the nine SE events of the MSI class in
        results/subtype/interpret/shared_class_events.csv are left out
  effect: exon_delta_adj of msi_cis (exon delta minus the B median of its mean-PSI decile)
  fdr_family: N1-N3 over the three cohorts (9 tests)
  predictions:
    - id: N1
      claim: among R exons, Spearman(exon_delta_adj, cohort mean PSI) < 0
    - id: N2
      claim: that Spearman is more negative for R than for R_deep (Fisher z, independent sets)
      why: a deep-intron T-run is not at the acceptor, so neither factor reads it there
    - id: N3
      claim: that Spearman is more negative for acceptor runs >= 20 than for runs 10-14 (Fisher z)
      why: hnRNP C needs long U-tracts; U2AF65 binds shorter ones
  exploratory: share of exons with exon_delta_adj > 0 by baseline-PSI tertile x run length
               (10-14, 15-19, >= 20); the absolute exon_delta_adj against run length, acceptor
               against deep window

msi_a3ss_replication:                    # D-54 · scripts/42_msi_repeats.py --only a3ss
  # Written 2026-10-12 after the D-52 and D-53 results were read, before any A3SS value was read
  # in this analysis (the A3SS view entered only SUBTYPE.md section 8, through its top events).
  # Seen: exploratory long_tract_share_up.csv - among SE repeat exons, runs >= 20 move toward
  # inclusion in MSI in all three cohorts (share up 0.55-0.73) while runs 10-19 move toward
  # skipping (0.32-0.55). A3SS events are a different event set, so they replicate both.
  events: subtype A3SS matrix, cohort pre-filter, finite in >= 80% of the cohort and >= 10 patients
          of MSI and of rest; one event per (long form, short form) pair, the first in matrix order
  acceptors: distal = start of the long form (PSI = use of it); proximal = start of the short
             form. Window -1..-50 upstream of each, sense strand, AG at -2,-1 of both
  sets:
    moderate: one acceptor with a T-run 10-19, the other <= 6
    long: one acceptor with a T-run >= 20, the other <= 6
    B: both acceptors <= 5 (background for exon_delta_adj, as msi_cis)
  effect: oriented delta = exon_delta_adj x (+1 if the run is at the distal acceptor, -1 if at the
          proximal); negative = the acceptor carrying the run is used less in MSI
  test: Wilcoxon signed-rank against 0, per cohort
  fdr_family: Q1-Q2 over the three cohorts (6 tests)
  predictions:
    - id: Q1
      claim: moderate runs - oriented delta < 0 (the repeat-bearing acceptor is used less in MSI)
      source: "Jonchere et al. 2024; Giannini et al. 2002 (as msi_cis M1)"
    - id: Q2
      claim: long runs - oriented delta > 0 (the repeat-bearing acceptor is used more in MSI)
      source: exploratory SE observation above; Zarnack et al. 2013 for a possible mechanism

msi_robustness:                          # D-55 · scripts/43_msi_robustness.py
  # Written 2026-10-12 after D-52..D-54 were read and reported, before anything below was computed.
  # Asks whether the repeat score of D-52 (score_acc) is a tumour-intrinsic MSI effect or could come
  # from the hospital that sent the sample, tumour composition, RNA handling or the feature filter.
  # Seen: every D-52..D-54 table; U9 (splicing models lose accuracy at unseen hospitals in
  # STAD_TCGA); label-only counts - MSI tumours from hospitals that also sent non-MSI tumours
  # (UCEC 34/34, STAD 55/55, COAD 39/40); adjacent normals of MSI patients (UCEC 1, STAD 3, COAD 5).
  # Not seen: any score by hospital, by composition, in normals or in the main matrix.
  score: score_acc of msi_cis (sample_scores.parquet), groups as msi_cis (MSI vs rest)
  covariates:
    stromal: mean log2 CPM of biology.yaml stromal_genes
    immune: mean log2 CPM of biology.yaml immune_genes
    ri_mean: the sample's mean RI PSI over the cohort's pre-filtered RI events (an RNA-handling proxy)
  fdr_family: S, the 7 tests S1-S4 in STAD_TCGA and COAD_TCGA (S3 pooled); UCEC_TCGA is reported
              beside them but is not in the family, because D-52 did not resolve it there
  predictions:
    - id: S1
      claim: within hospital, MSI tumours score lower than the rest - AUROC over MSI-rest pairs from
             the same tissue-source site > 0.5
      test: permutation of the MSI labels within site (10,000, seed 0); two-sided
    - id: S2
      claim: in OLS score ~ MSI + site (fixed effects) + stromal + immune + ri_mean, the MSI
             coefficient is < 0
      test: HC3 standard errors, two-sided t
    - id: S3
      claim: the tumour minus own-adjacent-normal score difference is lower for patients with an MSI
             tumour than for the other patients with a normal (UCEC, STAD, COAD pooled)
      test: Mann-Whitney; scores computed in the main matrix with each project's tumours and normals
            ranked together (same construction as msi_cis, exons by the same rules)
      why: MSI is somatic; a patient-, hospital- or handling-level cause would also mark the normal
    - id: S4
      claim: the score rebuilt in the main SE matrix (tumours only, its own feature filter, same rules)
             is lower in MSI than in rest (AUROC > 0.5)
      test: Mann-Whitney
  exploratory: leave-one-site-out AUROC range; the MSI-patient normals' scores against the other
               normals; AUROC within the lower-immune half; Spearman of the score with stromal,
               immune and ri_mean within MSI and within rest

msi_dna:                                 # D-56 · scripts/44_repeat_dna.py (loci, manifest), 45 (genotype, test)
  # Written 2026-10-12 after D-52..D-55 were read and before any read was fetched. The loci and
  # the BAM list come from step 44 (label-blind loci; open GDC metadata). The slices are fetched
  # by the data user with their own token; this repository never handles the credential.
  loci: acceptor T-run of SE repeat exons (all >= 20 nt; seeded random 250 of 14-19 and of 10-13),
        of A3SS repeat acceptors, and BAT-25 / BAT-26 as positive controls (785 loci)
  bams: harmonised WXS (BWA, GRCh38) - every MSI and POLE tumour with its normal (blood preferred),
        40 random MSS tumours per cohort, 20 of them with their normal; fetched in that order with
        a 6 GB stop (the user's 10 GB cap)
  reads: MAPQ >= 20; not unmapped, secondary, supplementary, QC-fail or duplicate
  informative_read: the read (reference-forward) holds the exact 8-nt left flank, >= 1 run base,
                    then the exact 8-nt right flank; run length = bases between the flanks
  usable_cell: at least 8 informative reads for that sample and locus
  germline_mode: mode of the patient's normal at the locus; tumours without a normal in the set use
                 the mode over all normals at the locus
  contraction: c = share of tumour reads shorter than the germline mode minus the same share in the
               normal (the patient's own; else all normals at the locus), a stutter correction
  burden: a tumour's mean c over its usable SE and A3SS loci
  fdr_family: D, the 8 tests G1-G6
  predictions:
    - id: G1
      claim: burden is higher in MSI than in rest tumours, in each cohort (Mann-Whitney)
      why: assay check - mismatch-repair deficiency shortens mononucleotide repeats
    - id: G2
      claim: UCEC_TCGA, burden is lower in POLE than in MSI tumours (Mann-Whitney)
    - id: G3
      claim: SE loci with runs 10-19 - within MSI tumours, per locus, Spearman(c, the exon's PSI
             percentile in its cohort) < 0; loci with >= 10 usable MSI tumours; sign test over loci
      why: the tumour whose allele is shorter skips the exon more - the cis route, tumour by tumour
    - id: G4
      claim: SE loci with runs 10-19 - across loci, the mean c of MSI tumours against the exon's
             mean delta_adj over the cohorts that measure it, Spearman < 0
    - id: G5
      claim: SE loci with runs >= 20 - as G3 but Spearman > 0 (shortening raises inclusion)
      why: the reversal of D-53/D-54 at the level of the allele
    - id: G6
      claim: across SE and A3SS loci, the mean c of MSI tumours rises with the reference run length
             (Spearman > 0)
      why: longer repeats slip more often (positive control of the dose)
  exploratory: BAT-25/BAT-26 c in each group; G3/G5 with c partialled on the tumour's burden;
               normals' share of reads shorter than the reference length, MSI patients against the
               rest (somatic or germline)

brca_germline:                           # D-57 · scripts/46_brca_germline.py
  # Written 2026-10-12 after D-52..D-56, before any test below was computed. Asks whether inherited
  # splicing variation reaches the BRCA subtype signal, by two routes: somatic loss of
  # heterozygosity (LOH) unmasking a germline splicing allele, and ancestry.
  # Seen: results/SUBTYPE.md and its BRCA tables; top_features_by_class.csv for BRCA, BRCA_ER and
  # BRCA_PAM50 (GSTM1 ranks 2nd among the ER-positive GEX features, higher GSTM1 -> ER-negative);
  # a label-blind scan of the BRCA SE matrix (896 genotype-like events, the 30 widest listed, e.g.
  # CAST at 0.05 / 0.55 / 0.99); counts only of race (white 758, Black 183, Asian 61), of ABSOLUTE
  # coverage (1,045 tumours, 108 with a normal in the matrix; LOH 19.6% of the genome) and of MC3
  # anchors (779 of the 896 events).
  # Not seen: any PSI against LOH, copy number, purity, race or subtype; any race tabulation by
  # class or by any feature; GSTM1 by race or ER.
  genotype_like:
    data: main matrices, all 8 AS views, BRCA tumours and normals of the tumour-status task
    eligible: at least 90% non-missing and SD > 0.12
    groups: two thresholds on a 0.02 grid (0.02-0.98, at least 0.08 apart, each group >= 5 samples)
            minimising the within-group sum of squares
    rule: centres evenly spaced (|left gap - right gap| < 0.25 x range), adjacent centres > 3 pooled
          within-group SD apart, and in the normals minor-allele frequency > 0.1 with Hardy-Weinberg
          chi-square p > 0.05
    one_per_gene: the event with the widest separation, for every test that pools events
  coordinates: events are GRCh38, ABSOLUTE and MC3 are GRCh37; each gene is anchored at the midpoint
               of its MC3 call span (all MC3 calls of that Ensembl gene, same chromosome); arms split
               at the largest gap between consecutive MC3 positions of each chromosome (13, 14, 15,
               21, 22 - q only)
  allelic_position: x = (PSI - low centre) / (high centre - low centre)
  loh: the ABSOLUTE segment holding the anchor has LOH = 1 (call status 'called' only)
  predicted_shift: "d_pred = f - 0.5 with f = (p x max(c1, c2) + 1 - p) / (p x (c1 + c2) + 2 (1 - p)); p
                   = ABSOLUTE purity, c1, c2 = Modal_HSCN_1, Modal_HSCN_2"
  heterozygous_pair: the patient's normal falls in the middle group; d = |x_tumour - 0.5|
  band: "|x - 0.5| < 0.15; expected in-band rate per event = share of the cohort's normals in band"
  depletion: per tumour and arm, 1 - (events in band) / (sum of expected rates), arms with >= 5
             anchored genes
  arm_loh: per tumour and arm, share of the arm's anchored genes in an LOH segment
  race: self-reported, Black or African American against white (others reported, not tested)
  gstm1_null: GEX log2(CPM + 1) of GSTM1 below its Otsu threshold over all BRCA tumours and normals
  fdr_families:
    L: L1-L6 (6 tests)
    A: A1-A3 (3 tests)
  predictions:
    - id: L1
      claim: in tumour-normal pairs, heterozygous events sit further from the middle (larger d) inside
             LOH segments than outside, within the same tumour (mean difference, tumours with >= 3 of
             each; sign test over tumours)
      why: with one allele lost, the tumour's PSI moves toward the retained allele's value
    - id: L2
      claim: the L1 difference rises with ABSOLUTE purity across those tumours (Spearman > 0)
      why: only the tumour cells lost the allele; the normal cells in the sample still carry both
    - id: L3
      claim: per tumour, Spearman(d, d_pred) over its heterozygous events > 0 (>= 10 events with
             two or more d_pred values); sign test over tumours
      why: gains of one homologue shift the allelic ratio too, by an amount set by copy number
    - id: L4
      claim: across arms, the LumA-minus-Basal difference in mean depletion follows the
             LumA-minus-Basal difference in the share of tumours with arm_loh >= 0.5 (Spearman > 0)
      why: if splicing reads LOH, the subtypes' different LOH maps show in their splicing
    - id: L5
      claim: 16q depletion is higher in lobular than in ductal tumours (AUROC > 0.5)
      why: 16q loss with the second CDH1 hit is the genomic hallmark of lobular cancer
    - id: L6
      claim: per arm, Spearman(depletion, arm_loh) across tumours > 0; sign test over arms
      why: the splicing read-out of LOH should track the DNA call arm by arm
    - id: A1
      claim: GSTM1 null is less frequent in Black than in white patients (log odds ratio < 0;
             Fisher, BRCA tumours)
      why: positive control - the GSTM1 deletion polymorphism differs in frequency by ancestry
    - id: A2
      claim: the odds ratio of ER-negative status for GSTM1 present shrinks when stratified by race
             (crude minus Mantel-Haenszel log odds ratio > 0; bootstrap over patients, 2,000, seed 0)
      why: ER-negative disease is more common in Black patients, who less often carry the deletion,
           so a germline marker can look like an ER feature
    - id: A3
      claim: more genotype-like genes differ in allele frequency between Black and white patients
             (Fisher on allele counts from the tumours' groups, BH q < 0.05) than in 1,000 race
             permutations (observed count above the permutation distribution; permutation p)
      why: positive control - ancestry is visible in splicing
  exploratory: genotype-like events among the subtype models' top events (top 30 per class and AS
               view, three BRCA cohorts) and their race and LOH behaviour; out-of-fold balanced
               accuracy by race (GEX, AS ensemble; BRCA, BRCA_ER, BRCA_PAM50); depletion maps of
               every PAM50 class; L1 in the other tumour-status projects

brca_her2:                               # D-58 · scripts/47_brca_her2.py
  # Written 2026-10-12 with D-57, before any test below was computed. "Her2" means two things: the
  # PAM50 HER2-enriched expression programme, and ERBB2 amplification (clinical HER2). The GEX
  # model's top Her2 genes are the 17q12 amplicon (STARD3, ERBB2, PGAP3, MIEN1, ORMDL3); of the AS
  # models' 240 top Her2 events, 3 lie in chr17:39.0-40.5 Mb (two ERBB2 ALE, one PLXDC1 HIT). A PSI
  # is a ratio and does not move with copy number. Seen: those lists. Not seen: any probability
  # against copy number or clinical HER2.
  amplified: ABSOLUTE Modal_Total_CN of the segment holding ERBB2's anchor >= 2 x the sample's
             ploidy (call status 'called')
  clinical_her2: positive when IHC or ISH is Positive; negative when IHC is Negative and ISH is not
                 Positive, or ISH is Negative and IHC is not Positive; otherwise unknown
  probability: out-of-fold P(Her2) of BRCA_PAM50 - GEX, and the AS ensemble (mean of the 8 AS views)
  fdr_family: H, the 4 tests H1-H4
  predictions:
    - id: H1
      claim: among PAM50 LumA and LumB tumours, GEX P(Her2) is higher in amplified tumours (AUROC > 0.5)
      why: GEX reads the amplicon even where the PAM50 label is luminal
    - id: H2
      claim: in the same tumours, AUROC(GEX) - AUROC(AS ensemble) > 0 (paired bootstrap, 2,000, seed 0)
      why: splicing cannot see copy number
    - id: H3
      claim: among PAM50 Her2 tumours, AUROC(GEX) - AUROC(AS ensemble) for amplified against not > 0
             (paired bootstrap)
    - id: H4
      claim: AS ensemble P(Her2) is higher in non-amplified PAM50 Her2 tumours than in amplified LumA
             and LumB tumours (AUROC > 0.5)
      why: if splicing follows the HER2-enriched programme, not the amplicon
  exploratory: H1-H4 with clinical HER2; the GEX counterpart of H4; ERBB2 events by amplification;
               P(Her2) against ERBB2 copy number relative to ploidy; agreement of amplified with
               clinical HER2

brca_mutations:                          # D-59 · scripts/48_brca_mutations.py
  # Written 2026-10-12 with D-57, before any test below was computed. Closes the open item of the
  # CDH1 event card (results/SUBTYPE.md: "whether the skipping tumours carry splice-site mutations
  # is not tested") and adds a positive control for mutation-driven splicing in BRCA.
  # Seen: label-blind counts in MC3 for the cohort - 997 tumours, 1,901 Splice_Site calls, 14 CDH1
  # splice-site calls (their HGVSc), SF3B1 missense (K700E 11, E622Q, K666E, K666N, N626D, A633V,
  # Y765C, D781E, E802Q one each); FILTER tallies. Not seen: any PSI by mutation.
  calls: MC3 public, the cohort's BRCA tumours, FILTER flags within {PASS, wga, native_wga_mix}
  splice_mapping: Splice_Site SNVs at +1/+2 or -1/-2 (HGVSc); the exon whose donor (+) or acceptor
                  (-) is hit, by the MC3 transcript's intron number, located in GENCODE v45 (same
                  transcript ID, same exon count) and matched to a main-matrix SE exon by coordinates
  percentile: the exon's PSI percentile in the mutated tumour among all other cohort tumours
  sf3b1_hotspot: missense at codons 622, 625, 626, 662, 663, 666, 700, 741 or 742
  cryptic_a3ss: A3SS events whose acceptors are 10-30 nt apart and whose long (upstream-acceptor) form
                has median PSI < 0.2 in the BRCA normals; score = mean within-cohort percentile of
                the long form's PSI
  fdr_family: C, the 3 tests C1-C3
  predictions:
    - id: C1
      claim: exons next to a splice-site mutation are skipped in the mutated tumour (percentile <
             0.5; sign test over mutations, every gene)
      why: positive control of the mapping
    - id: C2
      claim: as C1 for CDH1 alone
      why: a splice-site hit is one route to the CDH1 skipping seen in lobular tumours
    - id: C3
      claim: the cryptic A3SS score is higher in SF3B1-hotspot tumours (AUROC > 0.5)
      why: mutant SF3B1 selects AGs 10-30 nt upstream of the canonical one (Darman et al. 2015)
  exploratory: SF3B1-hotspot and CDH1-mutant tumours by PAM50 and histology; CDH1 exon PSI in
               lobular tumours by CDH1 status (splice, truncating, none); C1 by mutation side

brca_her2_uncapped:                      # D-60 · scripts/49_brca_her2_uncapped.py
  # Written 2026-10-13, after D-58's results and before the SNP6 segment file was downloaded. D-58's
  # amplified group came from ABSOLUTE, whose total copy number at ERBB2 is 7 at most in every
  # tumour, so it held only 31 LumA/LumB and 30 Her2 tumours and 34% of the clinically HER2-positive
  # ones. Seen: D-58's H1-H4 (H2 against: AS ensemble 0.81 vs GEX 0.72 in luminal tumours), its
  # exploratory table and knockout, every tumour's out-of-fold P(Her2), ABSOLUTE ERBB2 copy number,
  # clinical HER2. Not seen: any SNP6 segment (the file is not on disk when this is written).
  source: broad.mit.edu_PANCAN_Genome_Wide_SNP_6_whitelisted.seg (PanCanAtlas, GRCh37), the
          segment holding ERBB2's anchor (as D-58, the midpoint of its MC3 call span); a sample
          with several aliquots uses the first in sort order of the barcode
  copy_number: R = 2^Segment_Mean read as the copy ratio to the sample's average, ABSOLUTE's input
               convention; with ABSOLUTE purity a and ploidy t (call status 'called'),
               q = (R x (a t + 2 (1 - a)) - 2 (1 - a)) / a; no ceiling
  amplified: q / t >= 2 (D-58's rule without the ceiling)
  newly_amplified: amplified here and not amplified by D-58's ABSOLUTE rule
  probability: out-of-fold P(Her2) of BRCA_PAM50, GEX and the AS ensemble, as D-58
  fdr_family: HU, the 7 tests HU1-HU7
  predictions:
    - id: HU1
      claim: among LumA and LumB tumours, GEX P(Her2) is higher in amplified tumours (AUROC > 0.5)
      why: D-58 H1 with the wider group
    - id: HU2
      claim: in the same tumours, AUROC(AS ensemble) - AUROC(GEX) > 0 (paired bootstrap, 2,000,
             seed 0)
      why: D-58 H2's result. The 31 D-58 tumours are inside this group, so this is not independent
    - id: HU3
      claim: as HU2, newly amplified luminal tumours against non-amplified ones (the 31 D-58
             tumours left out); not testable with fewer than 10 newly amplified tumours
      why: the independent part of the replication; if the AS lead were a property of the highest
           amplifications, it would vanish here
    - id: HU4
      claim: among PAM50 Her2 tumours, AUROC(GEX) - AUROC(AS ensemble) for amplified against not > 0
      why: D-58 H3, kept as written (not resolved there)
    - id: HU5
      claim: AS ensemble P(Her2) is higher in non-amplified PAM50 Her2 tumours than in amplified LumA
             and LumB tumours (AUROC > 0.5)
      why: D-58 H4 with the wider group
    - id: HU6
      claim: among amplified luminal tumours, Spearman(GEX P(Her2), q / t) > 0
      why: the GEX model reads the amplicon genes (D-58 knockout, -0.03), whose expression rises
           with copy number
    - id: HU7
      claim: in the same tumours, Spearman(GEX) - Spearman(AS ensemble) > 0 (paired bootstrap)
      why: if splicing reads a programme rather than the amplicon, it should follow the dose less
  exploratory: a raw rule without ABSOLUTE (R >= 2) and HU1-HU5 under it; amplified share among
               clinically HER2-positive and -negative tumours under both rules; Spearman of q with
               ABSOLUTE copy number where ABSOLUTE is below 7; the per-sample length-weighted median
               Segment_Mean (the convention check); the D-58 knockout with this amplified group

# ---- MSI acceptor-repeat follow-up, 2026-10-13 (docs/MSI_REPEATS_LITERATURE.md Q1, Q5, Q2, Q3) ----
# Written before any test below was computed. Seen when written, for all four: D-52..D-56 and their
# tables (results/subtype/msi_cis/), including the D-52 exploratory frame shares (exons skipped in
# MSI with an acceptor T-run >= 10: 0.65, 0.62, 0.60 frameshifting, against 0.64 of all such exons),
# the shared-exon list (PTP4A2, UTP6, TMX3 ... ), the D-53 reversal (runs >= 20 move toward
# inclusion) and the literature in docs/MSI_REPEATS_LITERATURE.md. Structural checks made before
# writing (no outcome read): MC3 CONTEXT holds 6 left bases, the deleted bases, then 5 right bases,
# deletions left-aligned; GTEx LeafCutter intron start:end = our 0-based left_end : es + 1 (one
# offset matched SE junctions, none other); the Hamanaka et al. 2023 repeat catalogue holds no
# homopolymer (period 1 at 0 of 32,869 genotyped repeats), so Q3 uses GTEx v8 sQTL indels instead.
# All tests two-sided; supported / against / not resolved by BH q < 0.05 within the named family.

msi_deletion_load:                       # D-61 · scripts/50_msi_followup.py --only load
  # Q1. Seen: the per-patient score (D-52) and its AUROCs; ABSOLUTE purity. Not seen: any deletion
  # count per tumour or its relation to anything.
  calls: MC3 public, FILTER flags within {PASS, wga, native_wga_mix}, the cohorts' tumours (first
         15 characters of the barcode; one tumour per patient as in D-52)
  homopolymer_deletion: Variant_Type DEL whose deleted bases are all A or all T (length L), and whose
                        CONTEXT run of that base starting at the deletion (deleted plus right-flank
                        bases) is >= 5
  load: log(1 + count of homopolymer deletions) per tumour; long = L >= 2, short = L = 1
  long_share: long / all homopolymer deletions, tumours with >= 5 of them
  score: D-52 score_acc (lower = repeat exons less included)
  purity: ABSOLUTE purity, call status 'called'
  fdr_family: DL, the 6 tests DL1-DL6
  predictions:
    - id: DL1
      claim: STAD_TCGA MSI tumours - partial Spearman(score, load | purity) < 0
      why: more contracted tracts, more skipping (Collura et al. 2014; Hause et al. 2016)
    - id: DL2
      claim: as DL1, COAD_TCGA
    - id: DL3
      claim: as DL1, UCEC_TCGA
    - id: DL4
      claim: long_share is lower in MSI UCEC than in MSI STAD tumours (AUROC > 0.5)
      why: endometrial MSI shifts are about half the colorectal ones (Wang et al. 2017)
    - id: DL5
      claim: as DL4, against MSI COAD tumours
    - id: DL6
      claim: MSI tumours of the three cohorts, ranks within cohort - partial Spearman(score, long load |
             short load, purity) < 0
      why: large deletions weaken the tract more than single-base ones (Collura et al. 2014)
  exploratory: the same partial correlations in the rest groups; deletion length distribution and
               loads by cohort and group; score against load without the purity adjustment

msi_frame_nmd:                           # D-62 · scripts/50_msi_followup.py --only nmd
  # Q5. Not seen: any gene expression by MSI status for these genes, any coding or NMD annotation of
  # the exons.
  coding: the exon's coordinates equal an exon of an Ensembl_canonical protein_coding transcript in
          GENCODE v45, it lies wholly within that transcript's CDS, and it is neither the first exon
          nor one of the last two (skipping a frameshifting exon then leaves a premature stop that NMD
          can see)
  frameshift: exon length not a multiple of 3 (in-frame = a multiple of 3)
  exons: D-52 R exons (acceptor T-run >= 10), coding; per gene and cohort the exon with the
         smallest D-52 p
  expression: GEX log2(CPM + 1), host gene mean in MSI minus mean in rest, per cohort
  fdr_family: NM, the 4 tests NM1-NM4
  predictions:
    - id: NM1
      claim: STAD_TCGA - among exons less included in MSI (delta_adj < 0, D-52 q < 0.05), the host
             gene's expression change is lower when the exon is frameshifting (AUROC > 0.5)
      why: a skipped frameshifting exon makes an NMD substrate, so the gene's mRNA falls
    - id: NM2
      claim: as NM1, COAD_TCGA
    - id: NM3
      claim: as NM1, UCEC_TCGA (not testable with fewer than 5 exons in either frame class)
    - id: NM4
      claim: all exons of the three cohorts - Spearman(delta_adj, expression change) is higher for
             frameshifting than in-frame exons (difference > 0; bootstrap over exons, 2,000, seed 0)
      why: the more a frameshifting exon is skipped, the more its gene's mRNA is degraded
  exploratory: frameshifting coding exons skipped in all three cohorts (shared neoantigen candidates)
               with their genes; the same exons' in-frame counterparts; DNA-repair and innate-immune
               genes among them, read from the list without a test

msi_branchpoint:                         # D-63 · scripts/50_msi_followup.py --only branch
  # Q2. Not seen: where in the window each run lies, any branch-point motif. Branch-point tables
  # (Pineda and Bradley 2018, BPHunter) could not be fetched, so the branch point is read from
  # sequence. A branch-point A cannot lie inside a pure T run, so a long run pushes it upstream; an
  # AG is chosen optimally 19-23 nt downstream of the branch point (Chua and Reed 2001).
  run: the longest sense T-run overlapping -1..-50 (D-52); its 5' end d_run (nt from the 3'ss)
  branch_point: the A nearest the 3'ss, upstream of the run and within -100, matching the yUnAy
                motif around it (C or T 3 nt before the A, T 2 nt before, any base 1 nt before, C or
                T 1 nt after); none found = not scored
  d_bp: distance in nt from that A to the 3'ss
  exons: D-52 R exons (acceptor T-run >= 10) with delta_adj in the cohort
  adjustment: ranks of delta_adj and d_bp each residualised on run-length bins (10-11, 12-13,
              14-15, 16-19, 20-24, >= 25) and the rank of the cohort mean PSI; p by permuting d_bp
              within run-length bins (1,000, seed 0)
  fdr_family: BP, the 4 tests BP1-BP4
  predictions:
    - id: BP1
      claim: STAD_TCGA - adjusted Spearman(delta_adj, d_bp) > 0
      why: contraction moves a distant branch point toward the optimal window, so more inclusion;
           beyond run length itself
    - id: BP2
      claim: as BP1, COAD_TCGA
    - id: BP3
      claim: as BP1, UCEC_TCGA
    - id: BP4
      claim: exons measured in at least two cohorts, their mean delta_adj - adjusted Spearman with
             d_bp > 0
  exploratory: d_run in place of d_bp; the share moving up by d_bp tertile within run classes;
               an antisense-Alu k-mer within 300 nt upstream of the run (TGAGCCACCGCGCCCGGCC or
               GGCCGGGCGCGGTGGCTCA), by run class (Zarnack et al. 2013 setting)

msi_germline_indels:                     # D-64 · scripts/50_msi_followup.py --only germline
  # Q3. Not seen: any GTEx variant at our loci, any slope. GTEx v8 significant sQTL pairs (LeafCutter
  # introns) in the tissues matching the cohorts: Colon_Transverse, Stomach, Uterus.
  variants: indels whose inserted or deleted bases are all the sense T of the run (A on the plus
            strand for minus-strand genes), anchored at the run's genomic start - 1 through its end
  junctions: the exon's upstream and downstream inclusion introns and its skipping intron, as
             LeafCutter (start, end) = (left_end, es + 1), (ee, right_start + 1) and (left_end,
             right_start + 1) in our 0-based coordinates
  effect: z = slope / slope_se, signed so that positive = a longer tract raises inclusion (an
          insertion is longer; a skipping-intron effect counts negated); per exon, the median over
          its variants, junctions and tissues
  fdr_family: GL, the 3 tests GL1-GL3
  predictions:
    - id: GL1
      claim: R exons with runs 10-19 nt - the per-exon effect is positive (sign test; not testable
             with fewer than 5 exons)
      why: a longer germline poly-T raises inclusion, as CFTR 5T/7T/9T (Chu et al. 1993)
    - id: GL2
      claim: R exons with runs >= 20 nt - the per-exon effect is negative
      why: the MSI reversal (D-53) read in the germline
    - id: GL3
      claim: Spearman(per-exon effect, mean MSI delta_adj over the cohorts) < 0
      why: MSI shortens tracts, so a germline lengthening effect predicts the opposite MSI shift
  exploratory: the exons and variants behind GL1-GL3, by tissue

# ---- MSI sequence code, 2026-10-13 (after D-61..D-64) -------------------------------------------
# Written before any test below was computed. Seen when written: everything of D-52..D-64, including
# the D-63 exploratory table behind U17b (share of R exons more included in MSI, by branch-point
# tertile within run classes; STAD and COAD alone show the pattern the rule below uses), and the D-61
# deletion counts of the three cohorts (MSI: minimum 20 homopolymer deletions, 129 of 129 >= 10;
# the rest: 2 of 571 >= 10). Not seen: any splicing value, MC3 count or MMR call of any tumour
# outside UCEC_TCGA, STAD_TCGA and COAD_TCGA; any POLE, CIN or GS exon shift; any B-exon branch
# point. Structural checks made before writing (no outcome read): the pan-cancer SE matrix
# (data.nosync/ctsm_v1/matrices/se) holds 9,034 tumours and 695 normals of 33 TCGA projects and
# 71,208 exons, 68,679 of them already annotated by D-52 (the rest are annotated by the same code).
# The claim these build toward: mismatch-repair deficiency moves 3' splice-site use by a code in the
# reference genome (tract length and branch-point distance) that says, exon by exon, whether
# inclusion falls or rises, and that code, read in RNA, finds mismatch-repair-deficient tumours in
# organs never used to define it.
# All tests two-sided; supported / against / not resolved by BH q < 0.05 within the named family.
#
# Shared definitions (used by D-65..D-67):
#   R exon: acceptor T-run >= 10 at -1..-50 (D-52); B exon: <= 5
#   d_bp: the D-63 branch point (yUnAy A nearest the 3'ss, upstream of the run, within 100); for B
#         exons the yUnAy A nearest the 3'ss at positions 11..100 (the nearest an R-exon branch
#         point can lie)
#   rule (from D-53 and U17b, fixed here): R_down = runs 10-19; R_up = runs >= 20 with d_bp >= 36
#         (36 = the first tertile cut of d_bp among runs >= 20, label-blind); runs >= 20 with
#         d_bp < 36 or no branch point are left out
#   score A: the D-52 score (R against B, B weighted to R's mean-PSI deciles), lower = R less included
#   score G: set_score(R_down vs B) - set_score(R_up vs B), with D-52's set_score; lower = the
#            MMR-deficient direction on both arms
#   exon shift: D-52's delta_adj (group mean percentile minus reference mean percentile, minus the
#               median B-exon shift of the same mean-PSI decile)
#   adjusted rho: D-63's (ranks residualised on run-length bins and mean-PSI rank; p by permuting
#                 d_bp within run-length bins, 1,000, seed 0)

msi_code_specificity:                    # D-65 · scripts/51_msi_code.py --only specificity
  # Is D-63 about the branch point, and about mismatch repair?
  fdr_family: BS, the 4 tests BS1-BS4
  predictions:
    - id: BS1
      claim: R exons measured in >= 2 cohorts, mean delta_adj - Spearman with the gap d_bp - d_run,
             ranks residualised on run-length bins, mean-PSI rank and d_run rank, > 0; p by
             permuting the gap within run-length bins (1,000, seed 0)
      why: if the branch point's distance matters, it matters beyond where the run ends; if only the
           run's position matters, the gap adds nothing
    - id: BS2
      claim: the BP4 adjusted rho on R exons minus the same rho on B exons measured in >= 2 cohorts
             (residualised on mean-PSI rank only) > 0; bootstrap over exons within each set (2,000,
             seed 0)
      why: B exons have no tract to contract, so their branch-point distance should not set their
           MSI shift
    - id: BS3
      claim: UCEC_TCGA, R exons - adjusted rho(MSI-vs-rest delta_adj, d_bp) minus adjusted rho(POLE-
             vs-rest delta_adj, d_bp) > 0; exons measured in both contrasts (>= 10 finite values in
             each group); paired bootstrap over exons (2,000, seed 0)
      why: POLE tumours are hypermutated but mismatch-repair proficient; their repeats do not contract
    - id: BS4
      claim: as BS3 in STAD_TCGA with CIN-vs-GS delta_adj (two mismatch-repair-proficient classes) in
             place of POLE-vs-rest
      why: a second proficient contrast, with larger groups
  exploratory: share moving up by 10-nt d_bp bins within run classes (where the switch lies); BS3
               and BS4 shares by tertile; B-exon branch-point distances

msi_code_pancancer:                      # D-66 · scripts/51_msi_code.py --only pancancer
  # Does the code find MMR-deficient tumours in the 30 TCGA projects never used to define it?
  cancers: the 30 projects of the pan-cancer SE matrix other than COAD, STAD and UCEC
  tumours: role tumour, one per patient (first sample barcode in sort order), with >= 1 MC3 call
           passing the D-61 flags
  mmr_deficient: at least 10 MC3 homopolymer deletions (D-61 definition), set from the three cohorts
  hypermutated_proficient: < 10 homopolymer deletions and >= 500 SNVs (Variant_Type SNP, same flags)
  exons: per cancer and label-blind, finite PSI in >= 80% of the cancer's tumours, acceptor intron
         >= 60 nt, AG at -2,-1; percentiles and mean-PSI deciles within the cancer
  pooled_tumour_tests: each score as a percentile within its cancer, then pooled over cancers
  exon_shift: pooled over held-out tumours with the within-cancer percentiles; an exon needs >= 10
              MMR-deficient and >= 100 other finite values; deciles of the pooled mean PSI
  fdr_family: PC, the 8 tests PC1-PC8
  predictions:
    - id: PC1
      claim: score A lower in MMR-deficient tumours (pooled AUROC > 0.5)
      why: D-52's score, without any re-fitting, in new organs
    - id: PC2
      claim: score G lower in MMR-deficient tumours (pooled AUROC > 0.5)
    - id: PC3
      claim: AUROC(G) - AUROC(A) > 0; bootstrap of tumours within cancer and class (2,000, seed 0)
      why: the direction code (U17) adds to the length rule
    - id: PC4
      claim: as PC2 without READ, ESCA and UCS (the tissue relatives of COAD, STAD and UCEC)
      why: organ independence
    - id: PC5
      claim: score G lower in MMR-deficient than in hypermutated proficient tumours (AUROC > 0.5;
             not testable with fewer than 10 in either group)
      why: the code reads mismatch-repair deficiency, not mutation burden
    - id: PC6
      claim: R exons - Spearman(held-out pooled delta_adj, mean delta_adj of the three cohorts) > 0
      why: the same exons move in new organs
    - id: PC7
      claim: R exons - held-out pooled delta_adj higher for R_up than for R_down exons (AUROC > 0.5)
      why: the direction rule, exon by exon, in new organs
    - id: PC8
      claim: R exons - adjusted rho(held-out pooled delta_adj, d_bp) > 0
      why: D-63 replicated in new organs
  exploratory: per-cancer counts and AUROCs of A and G (cancers with >= 3 MMR-deficient tumours);
               MRE11 exon 5 PSI by class per cancer; dose within MMR-deficient tumours (partial
               Spearman of G with log homopolymer deletions given purity); G in the adjacent normals
               of MMR-deficient patients; no per-tumour value is committed

msi_code_endometrium:                    # D-67 · scripts/51_msi_code.py --only endometrium
  # D-52 could not separate UCEC MSI (AUROC 0.51), and D-61 ruled out deletion size. UCEC repeat
  # exons of 10-19 nt move down less often (U17b), so score A may cancel its own arms.
  fdr_family: EG, the 2 tests EG1-EG2
  predictions:
    - id: EG1
      claim: UCEC_TCGA, D-52 groups and exon universe - score G lower in MSI than in the rest
             (AUROC > 0.5)
    - id: EG2
      claim: UCEC_TCGA - AUROC(G) - AUROC(A) > 0; bootstrap of tumours within group (2,000, seed 0)
  exploratory: G in STAD_TCGA and COAD_TCGA (in-sample for the rule); G against POLE in UCEC

# ---- MSI sequence code: infiltration and independent MSI calls, 2026-10-13 (after D-65..D-67) ----
# Written before either was computed. Seen when written: everything of D-52..D-67, including the
# per-tumour score G percentiles and MC3 counts of the 30 held-out cancers (PC1-PC8, A-15) and
# D-55's infiltration result for score A. Not seen: any stromal, immune or RI covariate of a
# held-out tumour; any score G adjusted for them; any MANTIS or MSIsensor value (D-69's data are
# not downloaded; only cBioPortal's attribute metadata and record counts were read).
# All tests two-sided; supported / against / not resolved by BH q < 0.05 within the named family.
#
# Covariates (D-55's definitions): stromal = mean log2 CPM of biology.yaml stromal_genes; immune =
# the same for immune_genes; ri_mean = the tumour's mean RI PSI over the RI events finite in >= 80%
# of its cancer's tumours (label-blind, as D-66's exon filter); purity = ABSOLUTE, call status
# 'called'. In pooled models each covariate is a percentile within the tumour's cancer.

msi_code_infiltration:                   # D-68 · scripts/51_msi_code.py --only infiltration
  # Is score G an infiltration readout? MSI tumours are heavily infiltrated.
  fdr_family: IF, the 6 tests IF1-IF6
  predictions:
    - id: IF1
      claim: D-66 held-out tumours - OLS pct_G ~ mmr + C(project) + stromal + immune + ri_mean (HC3),
             coefficient of mmr < 0
    - id: IF2
      claim: as IF1 with ABSOLUTE purity added, tumours with a called purity
    - id: IF3
      claim: D-66 held-out tumours in the lower half of their cancer's immune score - pooled AUROC(pct_G
             lower in MMR-deficient) > 0.5
    - id: IF4
      claim: UCEC_TCGA - D-55's S2 model with score G in place of score A, OLS G ~ MSI + C(tss) +
             stromal + immune + ri_mean (HC3; single-patient sites left out as A-10), coefficient of
             MSI < 0
    - id: IF5
      claim: as IF4, STAD_TCGA
    - id: IF6
      claim: as IF4, COAD_TCGA
  exploratory: the unadjusted coefficients beside IF1 and IF4-IF6 (share of the effect kept); the
               AUROC of the immune score itself for MMR-deficient tumours; Spearman of each arm of G
               with immune within non-MMR-deficient tumours; IF3 by cancer where >= 3 MMR-deficient

msi_code_msi_calls:                      # D-69 · scripts/51_msi_code.py --only msicalls
  # Only if the user approves the download. Does score G follow MSI calls that do not come from MC3?
  data: cBioPortal TCGA PanCancer Atlas sample attributes MSI_SCORE_MANTIS (Bonneville et al. 2017)
        and MSI_SENSOR_SCORE, 32 studies, matched by 15-character sample barcode
  calls: MANTIS MSI-H above 0.6, MSS below 0.4, 0.4-0.6 left out; MSIsensor MSI-H above 10, MSS below
         4, 4-10 left out (cBioPortal's suggested thresholds)
  tumours: D-66's held-out tumours (30 projects, one per patient, with MC3 calls)
  fdr_family: MC, the 3 tests MC1-MC3
  predictions:
    - id: MC1
      claim: pooled AUROC(pct_G lower in MANTIS MSI-H than MSS) > 0.5 (not testable with fewer than
             10 MSI-H)
    - id: MC2
      claim: as MC1 with MSIsensor calls
    - id: MC3
      claim: Spearman(pct_G, MANTIS score as a percentile within cancer) < 0, all held-out tumours with
             a score
  exploratory: concordance of D-66's MC3 call with MANTIS and MSIsensor (counts by call); score G of
               discordant tumours; the same AUROCs in UCEC, STAD and COAD (in-sample for the rule)

# ---- MSI sequence code: is the rising arm real? 2026-10-13 (after D-68, D-69) ----
# Written before any of these tests was computed. Seen when written: everything of D-52..D-69,
# including PC7 (held-out R_up median delta_adj +0.028 against R_down -0.005; 73% of R_up exons
# more included), A-15 (R_up arm AUROC 0.735 for higher in MMR-deficient tumours), U19a's shares
# by branch-point bin, D-65's exploratory shares for runs >= 20 nt in POLE-vs-rest (0.56-0.59 up)
# and CIN-vs-GS (0.49-0.72 up), and D-63's d_run-for-d_bp check. Label-blind counts made today
# before writing: pan-cancer SE exons R_up 234, R_down 2,660, B 58,820, B_far 15,466, shield 158
# (124 without an acceptor run >= 10); AGEZ median 47 (R_up), 40 (R_down), 32 (B); Spearman of AGEZ
# with d_bp among runs >= 20 is 0.04. Not seen: any shift of B_far or shield exons, any AGEZ or
# PTBP1 relation to a shift, any statistic of a non-MSI subtype contrast on R_up exons, the
# global-axis adjustment of the R_up arm, the R_up arm against hypermutated proficient tumours or
# against deletion load.
# Not possible with local data, checked label-blind today: a locus-level DNA test from MC3 (the
# public MAF holds 458 A/T deletions within 50 nt upstream of any exon, none at MRE11 exon 5), and
# a retained-intron read-out of the same introns (2 R_up upstream introns have an RI event).
# All tests two-sided; supported / against / not resolved by BH q < 0.05 within the named family.

msi_code_reversal:                       # D-70 · scripts/52_msi_reversal.py
  # MSI makes exons after a run >= 20 nt with a far branch point MORE included (R_up). Is that
  # specific to mismatch repair, independent of a global splicing axis, dependent on the run lying
  # between the branch point and the AG, and does it follow deletion load?
  classes: label-blind, pan-cancer SE annotation. R_up, R_down and B as D-65; B_far = B exons with
           d_bp >= 36; shield = exons with acc_T < 10 whose upstream intron holds a T-run >= 20 nt
           starting >= 25 nt and ending <= 200 nt from the exon, with a yUnAy branch-point A at
           18 nt or more and at least 2 nt downstream of the run (between the run and the AG)
  agez: AG exclusion zone (Gooding et al. 2006), the distance from the exon to the first upstream
        AG whose G lies >= 12 nt from it, read up to 300 nt (censored at 300 or the intron end);
        a branch-point-free measure of how far the branch point can lie
  global_axis: per tumour, the mean percentile over all exons of its cancer's D-66 universe, as a
               percentile within the cancer (label-blind)
  held_out: D-66's tumours, exon universe, pooled exon shift (delta_adj) and arm scores; pct_up =
            the R_up arm (R_up against B) as a percentile within the cancer; covariates as D-68
  fdr_family: RV, the 8 tests RV1-RV8
  predictions:
    - id: RV1
      claim: the held-out R_up statistic is positive and larger than every-pair non-MSI subtype
             contrasts' absolute statistic; p = (1 + number of null contrasts with |s| >= s) /
             (1 + number of null contrasts)
      statistic: mean delta_adj over R_up exons, averaged over 50 draws (seed 0) of 20 tumours
                 per group; per draw, percentiles within the cohort (null) or within each
                 cancer (held-out), delta per exon with >= 10 finite values per group, B-exon
                 median per mean-PSI decile subtracted. Held-out draw = 20 of the 50 MMR-deficient
                 tumours, each paired with a random proficient tumour of the same cancer
      null: every pair of classes in each of the 22 subtype cohorts, after removing MSI- and
            POLE-labelled tumours and tumours with >= 10 MC3 homopolymer deletions, both groups
            >= 20
      why: if long-run exons rose whenever two tumour groups differ, MSI would not stand out
    - id: RV2
      claim: held-out tumours - OLS pct_up ~ mmr + C(project) + global_axis + stromal + immune +
             ri_mean (HC3), coefficient of mmr > 0
      why: the rise is not a tumour-wide shift in inclusion that long-run exons follow more
    - id: RV3
      claim: held-out pooled delta_adj higher for R_up than for B_far exons (AUROC > 0.5)
      why: a far branch point without a tract to contract should not rise
    - id: RV4
      claim: held-out exons with acc_T >= 20 - adjusted rho(delta_adj, agez | run bins 20-24 and
             >= 25, mean-PSI rank) > 0; p by permuting agez within bins (1,000, seed 0)
      why: the geometry reading without any branch-point predictor
    - id: RV5
      claim: held-out pooled delta_adj higher for R_up than for shield exons (AUROC > 0.5)
      why: contracting a run upstream of the branch point cannot shorten the branch point to AG
           distance; a run-binding repressor would not care which side of the branch point it is
    - id: RV6
      claim: MMR-deficient tumours (held-out) and MSI tumours of COAD_TCGA, STAD_TCGA and
             UCEC_TCGA with MC3 calls - partial Spearman(pct_up, log(1 + homopolymer deletions) |
             ABSOLUTE purity) > 0; pct_up within each cohort or cancer (the three cohorts with
             D-52's universe)
      why: more contraction, more rise
    - id: RV7
      claim: held-out pct_up higher in MMR-deficient than in hypermutated proficient tumours
             (AUROC > 0.5)
      why: mismatch repair, not mutation burden
    - id: RV8
      claim: held-out exons with acc_T >= 20 - Spearman(delta_adj, PTB sensitivity) < 0, where PTB
             sensitivity = mean over cancers (weighted by tumours) of the partial Spearman of the
             exon's PSI with PTBP1 log2 CPM given the global axis, proficient tumours only
      why: the alternative to geometry. Long tracts with distant branch points are often PTB-
           repressed (Gooding et al. 2006); if contraction relieves PTB, the most PTB-repressed
           exons rise most. Supported = PTB relief contributes; not resolved = no sign of it
  exploratory: the three training MSI contrasts against the RV1 null (in-sample); RV1 as a z-score;
               RV2 without the global axis; RV2 and RV7 with MANTIS MSI-H in place of MMR-deficient;
               RV3, RV4 and RV5 on the training cohorts' mean shift; shares up by class; R_up
               against B_far within exons whose length is a multiple of 3; arm coupling within
               MMR-deficient and within proficient tumours; no per-tumour value is committed

# ---- MSI sequence code: fitted models on the code, 2026-10-13 (after D-70 and A-16) ----
# Written before any model was fitted. Seen when written: everything of D-52..D-70 and A-16,
# including score G's held-out AUROC (0.832, D-66), each arm's held-out AUROC (rising 0.735,
# falling 0.611; A-15), the training cancers' share of long-run exons moving up by 10-nt branch-
# point bin (U19a: 0.12 at 20-29 nt, 0.73 at 30-39) and the same split held out (A-16: 0.20 at
# 18-29 nt, 0.60-0.84 beyond). Label-blind count made today: 30,568 exons lie in the D-66 universe
# of >= 25 of the 33 cancers (1,555 of them with an acceptor run >= 10). Not seen: any fitted
# model's performance, score G's AUPRC, any bin score's AUROC, any coefficient.
# All tests two-sided; supported / against / not resolved by BH q < 0.05 within the named family.

msi_code_models:                         # D-71 · scripts/54_msi_models.py
  # Does fitting weights on top of the code beat the fixed code in cancers never used, and does
  # learning per-exon weights (as the subtype models do) transfer worse than learning per-class
  # weights?
  tumours: all 33 projects of the pan-cancer SE matrix, role tumour, one per patient (first sample
           barcode in sort order), with >= 1 MC3 call passing the D-61 flags
  label: MMR-deficient = >= 10 MC3 homopolymer deletions (the D-61/D-66 definition)
  splits:
    E1: train on all COAD, STAD and UCEC tumours; test on D-66's 30 other cancers (primary)
    E2: leave one cancer out over all 33 (exploratory)
  features:   # all within the tumour's cancer, label-blind, computed once
    percentiles: each exon's PSI as a percentile over the cancer's tumours, D-66's universe (finite
                 in >= 80% of the cancer's tumours, acceptor intron >= 60 nt, AG); mean-PSI deciles
                 within the cancer
    set_scores: m42.set_score (the set's mean percentile minus decile-matched B exons), then a
                robust z within the cancer (median and 1.4826 x MAD; IQR / 1.349 if the MAD is 0;
                0 if both are 0); a set with no exon in the cancer scores 0
    arms: R_down and R_up as D-65 (2 features)
    bins: runs 10-11, 12-13, 14-15, 16-19 (any branch point) and runs >= 20 by branch-point distance
          20-29, 30-39, 40-49, 50-69, >= 70 nt and none found within 100 nt (10 features; D-63's
          run bins and U19a's 10-nt branch-point bins, both set on the training cancers)
    per_exon: the pool is the 30,568 exons in the universe of >= 25 of the 33 cancers; value = the
              exon's percentile minus the tumour's mean B-exon percentile in the exon's mean-PSI
              decile (set_score's background adjustment, exon by exon); 0 outside the cancer's
              universe or where missing
  models:     # scikit-learn; inputs standardised on the training set; class_weight balanced for
              # logistic regression, positives randomly oversampled to balance for MLPs
    M0: score G, no fit (D-66; ranked as -G within the cancer)
    M1: logistic regression (L2) on the 2 arms; C in {0.01, 0.1, 1, 10}
    M2: logistic regression (L2) on the 10 bins; C in {0.01, 0.1, 1, 10}
    M3: MLP on the 10 bins, one hidden layer of 16 ReLU units, adam, 500 iterations, no early
        stopping; alpha in {0.001, 0.01, 0.1}; mean probability over seeds 0-4
    M4: logistic regression (L2) on the 1,555 repeat exons of the pool (acceptor run >= 10);
        C in {1e-4, 1e-3, 1e-2, 1e-1}
    M5: logistic regression (L2) on all pool exons, top K by ANOVA F on the training set;
        K in {500, 2000} x C in {1e-4, 1e-3, 1e-2, 1e-1}
    M6: MLP as M3 with 64 hidden units on M5's inputs; K in {500, 2000} x alpha in {0.001, 0.01, 0.1}
  tuning: grid chosen by inner leave-one-cancer-out within the training set (in E1 the 3 cancers;
          in E2 a GroupKFold of 4 over cancers), maximising the pooled out-of-fold AUROC (MLPs use seed 0
          in the inner loop); refit on the whole training set with the chosen values
  metrics: pooled AUROC (primary); average precision (AUPRC); precision at recall 0.5 (exploratory)
  fdr_family: LR, the 7 tests LR1-LR7, all on E1; differences by paired bootstrap of test tumours
              within cancer x label strata (2,000, seed 0), models not refitted
  predictions:
    - id: LR1
      claim: AUROC(M1) - AUROC(M0) > 0
      why: G weights the arms equally; the rising arm carries more signal (A-15)
    - id: LR2
      claim: AUROC(M2) - AUROC(M1) > 0
      why: finer bins can follow the branch-point switch the 36-nt cut only approximates
    - id: LR3
      claim: AUROC(M3) - AUROC(M2) < 0
      why: on 10 inputs an MLP has nothing nonlinear to find and more to overfit
    - id: LR4
      claim: AUROC(M4) - AUROC(M2) < 0
      why: per-exon weights fitted in three cancers learn their tissue as well as the code
    - id: LR5
      claim: AUROC(M5) - AUROC(M2) < 0
      why: without the sequence prior the model learns the training cancers' MSI programmes
    - id: LR6
      claim: AUROC(M6) - AUROC(M2) < 0
      why: the pan-cancer cousin of the subtype models
    - id: LR7
      claim: AUPRC(M2) - AUPRC(M0) > 0
      why: with 0.65% positives held out, precision at the top of the ranking is what a test needs
  exploratory: E2 for M0-M5 (M6 is left out of E2 for compute); precision at recall 0.5; the inner-
               CV AUROC of each chosen setting beside its E1 AUROC; standardised coefficients of M1
               and M2; per-cancer AUROC where >= 3 positives; E1 with MANTIS MSI-H against MSS as
               the test label; per-tumour predictions are kept locally

msi_tool_benchmark:                      # D-72 · scripts/55_msi_benchmark.py
  # How does the all-exon logistic regression on splicing (D-71 M5) compare with the two exome MSI
  # callers probed in D-69 (MANTIS, MSIsensor) and with the MC3 homopolymer-deletion count that
  # defines our label? No tool here is a gold standard, so each DNA tool is judged against a
  # reference built from the other two, and M5 is judged against the same reference on the same
  # tumours.
  tumours: D-71's 8,464 tumours (33 cancers, one per patient, with MC3 calls) that have both a MANTIS
           and an MSIsensor score in the D-69 table (the common set; every method is scored on the
           same tumours)
  splits:
    E2: D-71's leave-one-cancer-out predictions, all 33 cancers (primary here; the only split with
        enough reference positives and the one that covers COAD, STAD and UCEC, where MSI testing
        is routine; every tumour is scored by a model that never saw its cancer)
    E1: D-71's train COAD, STAD, UCEC / test the other 30 (secondary)
  methods:
    dna: MC3 homopolymer-deletion count (n_hp); MANTIS score; MSIsensor score (higher = MSI)
    rna: M5 (tested); M0 score G, M2 and M4 alongside without tests; M6 in E1 only
  references:   # positive / negative; tumours in neither are left out of that reference
    R_MANTIS: MC3 >= 10 and MSIsensor > 10 / MC3 < 10 and MSIsensor < 4 (judges MANTIS)
    R_MSIsensor: MC3 >= 10 and MANTIS > 0.6 / MC3 < 10 and MANTIS < 0.4 (judges MSIsensor)
    R_MC3: MANTIS > 0.6 and MSIsensor > 10 / MANTIS < 0.4 and MSIsensor < 4 (judges the MC3 count)
    R_all: all three agree (exploratory)
  metric: within-cancer AUROC = the probability that a reference positive outranks a reference
          negative of the same cancer, over all such pairs (cancers with no positive drop out);
          it needs no calibration across cancers or across E2's 33 models. Pooled AUROC and
          AUPRC on native scores are exploratory
  fdr_family: BM, the 6 tests BM1-BM6; differences by paired bootstrap of reference tumours within
              cancer x reference-label strata (2,000, seed 0); nothing is refitted
  predictions:
    - id: BM1
      claim: E2, R_MANTIS - within-cancer AUROC(M5) - AUROC(MANTIS) < 0
      why: the DNA callers measure the instability itself, and they share the exome (and its
           coverage artefacts) with the reference, so correlated errors favour them
    - id: BM2
      claim: E2, R_MSIsensor - AUROC(M5) - AUROC(MSIsensor) < 0
      why: as BM1
    - id: BM3
      claim: E2, R_MC3 - AUROC(M5) - AUROC(MC3 count) < 0
      why: as BM1
    - id: BM4
      claim: as BM1 in E1
      why: as BM1
    - id: BM5
      claim: as BM2 in E1
      why: as BM1
    - id: BM6
      claim: as BM3 in E1
      why: as BM1
  descriptive: for each test, M5 is called non-inferior if the lower 95% bound of the difference is
               above -0.05 AUROC (margin set here, before any comparison; not part of the verdict)
  exploratory: coverage (share of the 8,464 tumours each method scores); pooled AUROC and AUPRC on
               native scores; R_all; a matched-volume operating point (in each reference, M5 flags
               as many tumours as the DNA tool calls MSI-H at its threshold - MANTIS > 0.6,
               MSIsensor > 10, MC3 >= 10 - by its native score, label-blind; sensitivity and PPV of
               both; in E2 the native scores come from 33 models); within-cancer AUROC per cancer
               with >= 3 reference positives; M5's within-cancer percentile in MC3 MMR-deficient
               tumours by MANTIS and MSIsensor call (both MSI-H, one, neither) and in tumours both
               callers call MSI-H that MC3 calls proficient (medians blanked below 5 tumours);
               per-tumour scores are kept locally
  seen_when_written: D-69's call concordance counts and score G against MANTIS and MSIsensor calls
                     in the 30 held-out cancers; D-71's E1 AUROC of M0-M6 against the MC3 label,
                     E2 pooled AUROC of M1 and M2, and M5's E1 per-cancer AUROC, PR curve and
                     coefficients (A-18). Not seen - any DNA tool scored against another, any RNA
                     model other than score G against MANTIS or MSIsensor, and M5 in E2

msi_rna_only:                            # D-73 · scripts/56_msi_rna_only.py
  # Which tumours does the repeat-exon logistic model (D-71 M4, shown alone by A-19) call MSI that
  # no exome measure calls, and do they look like missed mismatch-repair deficiency or false calls?
  tumours: D-71's 8,464 tumours (33 cancers) with their E2 score (each cancer scored by a model that
           never saw it)
  rna_call: M4's E2 decision function > 0 (the model's own call under balanced class weights; 168
            tumours, counted label-blind before any DNA status of a called tumour was read)
  dna_calls: MC3 >= 10 homopolymer deletions; MANTIS > 0.6; MSIsensor > 10 (D-69/D-72 thresholds)
  groups:   # among tumours with both caller scores; tumours missing one are reported separately
    rna_only: RNA call and none of the three DNA measures calls MSI
    reference: no RNA call and no DNA call
  tests:    # each covariate as a percentile within the tumour's cancer; AUROC of rna_only against
            # reference; p by permuting the group labels within cancer (10,000, seed 0), cancers
            # holding >= 1 rna_only tumour; not testable with fewer than 5 rna_only tumours
    - id: RO1
      claim: MLH1 expression lower in rna_only (AUROC for lower > 0.5)
      why: MLH1 promoter silencing is the commonest cause of sporadic MMR deficiency, and it is read
           in RNA, not in the exome
    - id: RO2
      claim: the lowest of the MLH1, MSH2, MSH6 and PMS2 expression percentiles is lower in rna_only
      why: loss of any one MMR protein suffices
    - id: RO3
      claim: MANTIS score higher in rna_only
      why: missed MMR deficiency should still leave sub-threshold instability
    - id: RO4
      claim: MSIsensor score higher in rna_only
      why: as RO3
    - id: RO5
      claim: MC3 homopolymer-deletion count higher in rna_only
      why: as RO3
  fdr_family: RO, the 5 tests RO1-RO5
  reading: RO1 or RO2 together with RO3-RO5 supported would mark the RNA-only calls as MMR
           deficiency the exome calls miss; none supported would mark them as false calls; anything
           in between is mixed
  exploratory: counts of RNA calls by the number of DNA measures that call MSI (0-3), and of DNA
               calls the model misses; RNA-only calls by cancer; tumours with an RNA call missing a
               caller score; ABSOLUTE purity and SNV count (RO-style AUROCs, no q); non-silent MC3
               mutations in MLH1, MSH2, MSH6, PMS2 and POLE; score G percentile; the RNA-only
               tumours' decision function against DNA-confirmed calls; per-tumour rows kept locally
               (data.nosync), committed tables aggregate only, medians blanked below 5 tumours
  seen_when_written: D-72's discordance table (MC3-deficient tumours by caller calls, and their
                     position in the model's ranking); the number of RNA calls at decision > 0
                     (label-blind). Not seen - the DNA status, expression or purity of any RNA call
