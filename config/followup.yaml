# Follow-up analyses, fixed before any of them was computed.
#   subtype_regulators, subtype_site_probe   docs/SUBTYPE_METHODS.md D-46, D-47
#   cross_task                               docs/ACROSS_TASKS_METHODS.md D-48..D-51
#   msi_cis                                  docs/SUBTYPE_METHODS.md D-52 (added later the same day)
#   msi_long_tracts                          docs/SUBTYPE_METHODS.md D-53 (after D-52's results)
#   msi_a3ss_replication                     docs/SUBTYPE_METHODS.md D-54 (after D-53's results)
#   msi_robustness                           docs/SUBTYPE_METHODS.md D-55 (after D-54's results)
#
# Written 2026-10-12, after every model of the three tasks had been fitted and summarised, and
# before any analysis below was run. Nothing here refits a model or changes a label, a cohort, a
# feature or a threshold of the existing tasks: everything is computed from stored data, stored
# out-of-fold predictions and stored held-out SHAP values.
#
# What had already been seen when this file was written (so it could have shaped a prediction):
#   - the subtype results of results/SUBTYPE.md, including the leiomyosarcoma ACTN1/TPM1 events,
#     their direction in LMS, and the cross-family tables (histology model vs molecular class);
#   - the tumour-status regulator layer (BIOLOGY_METHODS D-18) and the pan-cancer site probe
#     (D-20), whose splicing views lost more accuracy than GEX when sites were held out;
#   - the cancer-type confusion tables at project level (e.g. ESCA <-> STAD, CESC <-> HNSC);
#   - the number of tissue-source sites per subtype class (label-only; used for the site rule).
# Not seen: splicing-factor expression by subtype class, any type or status probability broken
# down by subtype, any site-held-out subtype accuracy, any subtype exon's protein annotation.
#
# A prediction is "supported" when the difference is in the stated direction with BH q < 0.05
# in its family; "against" when it is in the opposite direction with q < 0.05; otherwise "not
# resolved". All tests are two-sided; the stated direction is the claim being checked.

subtype_regulators:                      # D-46 · scripts/37_subtype_regulators.py
  factors: biology.yaml regulators.splicing_factors       # the same 70 factors as D-18
  covariates: [stromal_genes, immune_genes]                # biology.yaml, as D-18
  scan:
    test_two_classes: mann_whitney
    test_more_classes: kruskal
    fdr_family: per cohort, over the factors measured in it
    effect: AUROC of each class against the rest of the cohort
  association:                           # as D-18, with subtype top events
    top_events_per_view: 50              # overall importance of the cohort's model
    views: [se, a3ss, a5ss, mxe, ri]
    n_background_events: 500
    rho: 0.3
    min_finite: 0.7
  predictions:
    - id: R1
      cohort: MESO
      gene: ESRP1
      higher_in: [Epithelioid]
      lower_in: [Biphasic]
      why: ESRP1/2 drive the epithelial splicing programme and are lost in EMT; biphasic
           tumours carry a sarcomatoid (mesenchymal) component
      source: Warzecha et al. 2009 Mol Cell 33:591; Warzecha et al. 2010 EMBO J 29:3286
    - id: R2
      cohort: MESO
      gene: ESRP2
      higher_in: [Epithelioid]
      lower_in: [Biphasic]
      source: as R1
    - id: R3
      cohort: HNSC_mRNA
      gene: ESRP1
      higher_in: [Atypical, Basal, Classical]
      lower_in: [Mesenchymal]
      why: the mesenchymal class is defined by EMT and stromal/immune genes
      source: Warzecha et al. 2010; TCGA 2015 Nature 517:576
    - id: R4
      cohort: SARC
      gene: PTBP1
      higher_in: [DDLPS, UPS, MFS]
      lower_in: [LMS]
      why: PTBP1 represses the smooth-muscle exons of ACTN1 and TPM1
      source: Southby et al. 1999 Mol Cell Biol 19:2699; Gooding et al. 1998 RNA 4:85
    - id: R5
      cohort: SARC
      gene: PTBP1
      event: "ENSG00000072110.15#chr14:68878457-68878523#-;68878988-68879069;68877081-68877240;68879961-68880108"
      event_name: ACTN1 mutually exclusive exons (MXE)
      claim: partial Spearman (PTBP1 log2 CPM, PSI), adjusting for class, stromal and immune
             scores, has the sign opposite to the LMS-minus-rest median PSI difference
      source: Southby et al. 1999
    - id: R6
      cohort: SARC
      gene: PTBP1
      event: "ENSG00000140416.23#chr15:63043705-63043831#+;63044026-63044152;63042757-63042943;63056984-63057118"
      event_name: TPM1 exons 2/3 (MXE)
      claim: as R5
      source: Gooding et al. 1998
  fdr_family_predictions: R1-R6 together

subtype_site_probe:                      # D-47 · scripts/38_subtype_site_probe.py
  pipeline: as BIOLOGY_METHODS D-20 (top-2,000 variance, median impute, standardise,
            L2 logistic regression C = 0.05, balanced classes; multinomial for > 2 classes)
  schemes: [case-grouped, site-held-out]   # StratifiedGroupKFold(5) by case / by TSS
  seeds: [0, 1, 2]
  views: all nine
  metric: balanced accuracy of the pooled out-of-fold calls, mean over seeds
  drop: case-grouped minus site-held-out
  min_sites_per_class: 5                 # else the cohort is not probed (SARC: MFS has 4)
  confounding: Cramer's V between TSS and class, from the task table (no model)
  predictions:
    - id: P1
      claim: in most probed cohorts the median drop of the 8 AS views exceeds the GEX drop
      test: sign test over cohorts
      why: D-20 found the splicing views more site-sensitive than GEX for neighbouring projects
    - id: P2
      claim: across cohorts, the drop rises with Cramer's V (Spearman > 0), for GEX and for the
             AS-view median separately
      why: a model can only lean on site where class and site go together

cross_task:                              # docs/ACROSS_TASKS_METHODS.md · scripts/40_cross_task.py
  models: [GEX, AS ensemble, GEX + AS]   # out-of-fold; AS ensemble = mean of the 8 AS views;
                                         # GEX + AS = 0.5 GEX + 0.5 AS ensemble (as D-23, D-40)
  gene_overlap:                          # D-48
    top_genes: 100                       # gene = its best feature (biology.gene_ranking)
    status: overall importance of the cancer's tumour-status model
    type: importance over the samples of the cancer's own class (cancer-type model)
    subtype: overall importance of the cohort's model
    universe: genes with a feature passing both tasks' pre-filters for that cancer / cohort
    test: hypergeometric; BH over all (pair, cohort, view)
    predictions:
      - id: G1
        claim: every task pair overlaps above chance (median fold enrichment > 1 over cohorts and views)
      - id: G2
        claim: for histology cohorts, subtype-type overlap exceeds subtype-status overlap
               (paired Wilcoxon on Jaccard over cohort x view)
        why: a histology class is a lineage, which the cancer-type models read; tumour status
             reads tumour-versus-normal programmes
  type_probability_by_subtype:           # D-49
    measure: per patient, the sum of the type model's out-of-fold probabilities over the target classes
    test: Mann-Whitney between the named subtype groups; effect AUROC; BH over predictions, per model
    predictions:
      - {id: T1, cohort: ESCA, targets: [HNSC, LUSC, CESC], higher_in: [Squamous], lower_in: [Adenocarcinoma],
         source: "TCGA 2017 Nature 541:169"}
      - {id: T2, cohort: ESCA, targets: [STAD], higher_in: [Adenocarcinoma], lower_in: [Squamous],
         source: "TCGA 2017 Nature 541:169"}
      - {id: T3, cohort: CESC, targets: [HNSC, LUSC], higher_in: [Squamous], lower_in: [Adenocarcinoma],
         source: "TCGA 2017 Nature 543:378"}
      - {id: T4, cohort: CESC, targets: [UCEC], higher_in: [Adenocarcinoma], lower_in: [Squamous],
         source: "TCGA 2017 Nature 543:378 (endometrial-like cervical cancers)"}
      - {id: T5, cohort: LGG_IDH, targets: [GBM], higher_in: [IDHwt], lower_in: [IDHmut-codel, IDHmut-non-codel],
         source: "Brat et al. 2015 NEJM 372:2481; Ceccarelli et al. 2016 Cell 164:550"}
      - {id: T6, cohort: BRCA_PAM50, targets: [OV], higher_in: [Basal], lower_in: [LumA, LumB, Her2, Normal-like],
         source: "TCGA 2012 Nature 490:61"}
      - {id: T7, cohort: UCEC_TCGA, targets: [OV, UCS], higher_in: [CN-high], lower_in: [POLE, MSI, CN-low],
         source: "TCGA 2013 Nature 497:67"}
      - {id: T8, cohort: UCEC, targets: [OV, UCS], higher_in: [Serous], lower_in: [Endometrioid],
         source: "TCGA 2013 Nature 497:67"}
      - {id: T9, cohort: MESO, targets: [SARC], higher_in: [Biphasic], lower_in: [Epithelioid],
         source: "WHO definition (sarcomatoid component); Hmeljak et al. 2018 Cancer Discov 8:1548"}
      - {id: T10, cohort: HNSC_HPV, targets: [CESC], higher_in: [HPV-positive], lower_in: [HPV-negative],
         source: "Pyeon et al. 2007 Cancer Res 67:4605"}
      - {id: T11, cohort: PCPG_mRNA, targets: [ACC], higher_in: [Cortical admixture],
         lower_in: [Kinase signaling, Pseudohypoxia, Wnt-altered],
         source: "Fishbein et al. 2017 Cancer Cell 31:181 (positive control: adrenal cortex in the sample)"}
      - {id: T12, cohort: STAD_TCGA, targets: [ESCA], higher_in: [CIN], lower_in: [MSI, GS, EBV],
         source: "TCGA 2017 Nature 541:169 (oesophageal adenocarcinoma resembles CIN gastric cancer)"}
      - {id: T13, cohort: STAD, targets: [COAD, READ], higher_in: [Intestinal], lower_in: [Diffuse],
         source: "Lauren 1965 Acta Pathol Microbiol Scand 64:31 (intestinal-type glands)"}
    descriptive: mean probability of every type class within every subtype class; the share of
                 each subtype class the type model calls another project, and which
  status_probability_by_subtype:         # D-50
    cohorts: subtype cohorts of the cancers with a tumour-status model
    measure: out-of-fold P(tumour) of the primary tumour
    test: Mann-Whitney between the named groups; BH over predictions, per model;
          Kruskal-Wallis per cohort (descriptive, BH over cohorts)
    predictions:
      - {id: S1, cohort: BRCA_PAM50, lower_in: [Normal-like], higher_in: [LumA, LumB, Her2, Basal],
         source: "Parker et al. 2009 J Clin Oncol 27:1160 (normal-like reflects normal-tissue content)"}
      - {id: S2, cohort: THCA, lower_in: [Follicular], higher_in: [Classical],
         source: "TCGA 2014 Cell 159:676 (RAS-like, follicular, most differentiated)"}
      - {id: S3, cohort: THCA, lower_in: [Classical], higher_in: [Tall cell],
         source: "TCGA 2014 Cell 159:676 (tall-cell-like cluster, lowest differentiation score)"}
      - {id: S4, cohort: STAD, lower_in: [Diffuse], higher_in: [Intestinal],
         source: "Lauren 1965 (diffuse type infiltrates as scattered cells in stroma)"}
      - {id: S5, cohort: STAD_TCGA, lower_in: [GS], higher_in: [CIN, MSI, EBV],
         source: "TCGA 2014 Nature 513:202 (GS enriched for diffuse histology)"}
      - {id: S6, cohort: BRCA, lower_in: [Lobular], higher_in: [Ductal],
         source: "histological definition (discohesive single-file infiltration)"}
    composition: within the tumours of each such cancer, Spearman of P(tumour) with the stromal and
                 the immune score (biology.yaml genes); predicted negative (C1)
  exon_protein_character:                # D-51
    sets: tumour status top SE exons and cancer-type top SE exons (as D-17), and the union of the
          top 100 SE events of every subtype cohort's model (overall importance)
    background: the same random 6,000 measured exons as D-17
    metrics: as D-17 (length divisible by 3; exact GENCODE exon; coding; Pfam/CDD domain,
             disordered region and TM helix among fully coding exons)
    prediction:
      - id: E1
        claim: subtype top exons are, like the other two tasks', more often divisible by 3, less often
               in a domain and more often in a disordered region than the background
        source: "Buljan et al. 2012 Mol Cell 46:871; Ellis et al. 2012 Mol Cell 46:884"

msi_cis:                                 # D-52 · scripts/42_msi_repeats.py
  # Written 2026-10-12, after results/SUBTYPE.md §8 and before any PSI value was read by repeat
  # class. Already seen when this section was written (so it could have shaped a prediction):
  #   - SUBTYPE.md §8 / U7: ten MSI events shared by UCEC, STAD and COAD, their direction (7 of 9
  #     loci less included in MSI), the POLE tumours' values on them, the immune and MLH1 checks;
  #   - the label counts below, and the PCR MSI status of the UCEC_TCGA POLE tumours (1 MSI-H);
  #   - the label-blind repeat annotation (`--only annotate`): the distribution of acceptor T-run
  #     lengths, set sizes per cohort, and that MRE11 exon 5 (88 nt, chr11:94479674-94479761) has
  #     a T11 acceptor run while HSPH1 exon 9 is not a cassette event of either SE matrix;
  #   - Jonchere et al. 2024 Genome Biol 25:210 (MSI at U2AF-binding polypyrimidine tracts ->
  #     exon skipping, colorectal only); Dorard et al. 2011 Nat Med 17:1283 (HSP110 T17);
  #     Giannini et al. 2002 EMBO Rep 3:248 (MRE11 T11 -> exon 5 skipping).
  # Not seen: any PSI by repeat class or by MSI status outside the ten U7 events, any score.
  cohorts: [UCEC_TCGA, STAD_TCGA, COAD_TCGA]          # subtype task tables, unchanged
  groups:
    MSI: label MSI (UCEC.MSI; GI.HM-indel)
    rest: every other class except POLE (UCEC CN-low + CN-high; STAD CIN + GS + EBV; COAD CIN + GS)
    POLE: UCEC_TCGA label POLE, without the PCR MSI-H tumour (TCGASubtype Subtype_other)
  exons:
    matrix: subtype SE matrix, features passing the cohort's pre-filter
    keep: finite PSI in >= 80% of the cohort and >= 10 patients of each compared group;
          acceptor window measurable (upstream intron >= 60 nt) with AG at -2,-1
  repeats:                               # sense strand, longest homopolymer run overlapping a window
    acceptor: positions -1..-50 of the upstream intron
    deep: positions -201..-400 of the upstream intron (intron >= 500 nt)
    R: acceptor T-run >= 10              # repeat exons
    B: acceptor T-run <= 5               # background exons
    R_deep: acceptor T-run <= 6 and deep T-run >= 10
    B_deep: acceptor T-run <= 5 and deep T-run <= 5
    dose_bins: [6-7, 8-9, 10-11, 12-13, ">=14"]
  score:
    percentile: per exon, PSI ranked over the cohort's patients (average ties, missing left out)
    sample_score: mean percentile over R minus the mean over B, B weighted to R's distribution over
                  deciles of the exon's cohort mean PSI (cancels the global PSI axis of D-24)
    exon_delta: mean percentile in MSI minus mean percentile in rest
  bootstrap: {reps: 2000, seed: 0, resample: patients within group}
  fdr_families:
    M: M1-M7, all cohorts together (19 tests)
    K: K1 over the cohorts
  predictions:
    - id: M1
      claim: in each cohort the sample score is lower in MSI than in rest (AUROC > 0.5)
      test: Mann-Whitney
      why: shortened acceptor poly-T tracts weaken the 3' splice site, so the exon is skipped
      source: "Jonchere et al. 2024 Genome Biol 25:210; Giannini et al. 2002; Dorard et al. 2011"
    - id: M2
      claim: across exons with an acceptor T-run >= 6, exon_delta falls as the run lengthens
             (partial Spearman < 0, adjusting for the cohort mean PSI)
      why: longer repeats slip more often in MMR-deficient cells
    - id: M3
      claim: as M2, also adjusting for the pyrimidine fraction of positions -1..-50
      why: separates repeat slippage from a trans change that tracks 3' splice-site strength
    - id: M4
      claim: the acceptor score separates MSI from rest better than the same score built from the
             deep window (R_deep vs B_deep) - AUROC difference > 0
      test: paired bootstrap; p = 2 x the smaller tail share (floor 1/2000)
      why: a repeat acts on the acceptor only inside the polypyrimidine tract / branch-point region
    - id: M5
      claim: UCEC_TCGA, the sample score is lower in MSI than in POLE (AUROC > 0.5)
      test: Mann-Whitney
      why: POLE tumours are hypermutated by base substitutions but mismatch-repair proficient, so
           their repeats are stable; expectation, not a verdict - POLE vs rest AUROC near 0.5
    - id: M6
      claim: the top 50 SE events of each cohort's MSI class (mean |SHAP| over MSI patients, D-38
             cache) carry an acceptor T-run >= 10 more often than the cohort's other exons
      test: Fisher exact (odds ratio > 1)
      why: if the cis route is real, the models that learned MSI from data will have used it
    - id: M7
      claim: for R exons measured in two cohorts, exon_delta minus the median exon_delta of B exons
             in the same mean-PSI decile correlates between the cohorts (Spearman > 0; 3 pairs)
      why: the same repeats are exposed in every MMR-deficient genome, whatever the organ
    - id: K1
      claim: MRE11 exon 5 (T11 acceptor) is less included in MSI than in rest, in each cohort
      test: Mann-Whitney on PSI
      source: "Giannini et al. 2002 EMBO Rep 3:248; Giannini et al. 2004 Oncogene 23:2640"
  exploratory:                           # reported as such, never as a verdict
    dose_auroc: the sample-score AUROC per dose bin (each bin's exons against B)
    share_explained: of exons less included in MSI (per-exon Mann-Whitney, BH q < 0.05 within the
                     cohort), the share with an acceptor T-run >= 10, against the share among all
    u7_events: the acceptor T-runs of the ten U7 events
    detector: the sample score as a label-free MSI detector (MSI vs every other patient) next to
              the subtype models' out-of-fold MSI AUROCs
    base_specificity: the same score from A-, C- and G-runs (A >= 10, C >= 8, G >= 8)
    donor: the same score from T-runs at +1..+50 of the downstream intron
    cn_low: UCEC MSI against CN-low only (both mostly endometrioid)
    pole_msi_h: where the PCR MSI-H POLE tumour falls
    frame: share of exons skipped in MSI with an acceptor T-run >= 10 whose length is not a
           multiple of 3 (skipping shifts the frame), against all R exons
    shared: R exons less included in MSI in all three cohorts, ranked

msi_long_tracts:                         # D-53 · scripts/42_msi_repeats.py --only tracts
  # Written 2026-10-12 after the D-52 results (results/subtype/msi_cis/) had been read, before the
  # relation below was computed. Prompted by two observations: the two U7 loci MORE included in
  # MSI (CCNDBP1, ANXA7) carry the longest acceptor T-runs of the U7 events (30 and 29 nt), and the
  # spread of exon_delta widens for runs >= 14 (dose_exon_delta.csv, both tails). Seen: those two
  # tables, the U7 events' runs, every D-52 prediction and exploratory table. Not seen: exon_delta
  # against baseline inclusion for any repeat set, or any table split by baseline PSI.
  hypothesis: a long U-tract is bound by hnRNP C, which competes with U2AF65 and represses the
              acceptor; shortening it in MSI can relieve repression (inclusion up) while a
              moderate tract that U2AF65 needs is weakened (inclusion down). Repressed exons have
              low baseline inclusion, so the MSI shift should depend on baseline PSI.
  source: "Zarnack et al. 2013 Cell 152:453 (hnRNP C vs U2AF65 at U-tracts, Alu exons)"
  sets: R and R_deep of msi_cis; the nine SE events of the MSI class in
        results/subtype/interpret/shared_class_events.csv are left out
  effect: exon_delta_adj of msi_cis (exon delta minus the B median of its mean-PSI decile)
  fdr_family: N1-N3 over the three cohorts (9 tests)
  predictions:
    - id: N1
      claim: among R exons, Spearman(exon_delta_adj, cohort mean PSI) < 0
    - id: N2
      claim: that Spearman is more negative for R than for R_deep (Fisher z, independent sets)
      why: a deep-intron T-run is not at the acceptor, so neither factor reads it there
    - id: N3
      claim: that Spearman is more negative for acceptor runs >= 20 than for runs 10-14 (Fisher z)
      why: hnRNP C needs long U-tracts; U2AF65 binds shorter ones
  exploratory: share of exons with exon_delta_adj > 0 by baseline-PSI tertile x run length
               (10-14, 15-19, >= 20); the absolute exon_delta_adj against run length, acceptor
               against deep window

msi_a3ss_replication:                    # D-54 · scripts/42_msi_repeats.py --only a3ss
  # Written 2026-10-12 after the D-52 and D-53 results were read, before any A3SS value was read
  # in this analysis (the A3SS view entered only SUBTYPE.md section 8, through its top events).
  # Seen: exploratory long_tract_share_up.csv - among SE repeat exons, runs >= 20 move toward
  # inclusion in MSI in all three cohorts (share up 0.55-0.73) while runs 10-19 move toward
  # skipping (0.32-0.55). A3SS events are a different event set, so they replicate both.
  events: subtype A3SS matrix, cohort pre-filter, finite in >= 80% of the cohort and >= 10 patients
          of MSI and of rest; one event per (long form, short form) pair, the first in matrix order
  acceptors: distal = start of the long form (PSI = use of it); proximal = start of the short
             form. Window -1..-50 upstream of each, sense strand, AG at -2,-1 of both
  sets:
    moderate: one acceptor with a T-run 10-19, the other <= 6
    long: one acceptor with a T-run >= 20, the other <= 6
    B: both acceptors <= 5 (background for exon_delta_adj, as msi_cis)
  effect: oriented delta = exon_delta_adj x (+1 if the run is at the distal acceptor, -1 if at the
          proximal); negative = the acceptor carrying the run is used less in MSI
  test: Wilcoxon signed-rank against 0, per cohort
  fdr_family: Q1-Q2 over the three cohorts (6 tests)
  predictions:
    - id: Q1
      claim: moderate runs - oriented delta < 0 (the repeat-bearing acceptor is used less in MSI)
      source: "Jonchere et al. 2024; Giannini et al. 2002 (as msi_cis M1)"
    - id: Q2
      claim: long runs - oriented delta > 0 (the repeat-bearing acceptor is used more in MSI)
      source: exploratory SE observation above; Zarnack et al. 2013 for a possible mechanism

msi_robustness:                          # D-55 · scripts/43_msi_robustness.py
  # Written 2026-10-12 after D-52..D-54 were read and reported, before anything below was computed.
  # Asks whether the repeat score of D-52 (score_acc) is a tumour-intrinsic MSI effect or could come
  # from the hospital that sent the sample, tumour composition, RNA handling or the feature filter.
  # Seen: every D-52..D-54 table; U9 (splicing models lose accuracy at unseen hospitals in
  # STAD_TCGA); label-only counts - MSI tumours from hospitals that also sent non-MSI tumours
  # (UCEC 34/34, STAD 55/55, COAD 39/40); adjacent normals of MSI patients (UCEC 1, STAD 3, COAD 5).
  # Not seen: any score by hospital, by composition, in normals or in the main matrix.
  score: score_acc of msi_cis (sample_scores.parquet), groups as msi_cis (MSI vs rest)
  covariates:
    stromal: mean log2 CPM of biology.yaml stromal_genes
    immune: mean log2 CPM of biology.yaml immune_genes
    ri_mean: the sample's mean RI PSI over the cohort's pre-filtered RI events (an RNA-handling proxy)
  fdr_family: S, the 7 tests S1-S4 in STAD_TCGA and COAD_TCGA (S3 pooled); UCEC_TCGA is reported
              beside them but is not in the family, because D-52 did not resolve it there
  predictions:
    - id: S1
      claim: within hospital, MSI tumours score lower than the rest - AUROC over MSI-rest pairs from
             the same tissue-source site > 0.5
      test: permutation of the MSI labels within site (10,000, seed 0); two-sided
    - id: S2
      claim: in OLS score ~ MSI + site (fixed effects) + stromal + immune + ri_mean, the MSI
             coefficient is < 0
      test: HC3 standard errors, two-sided t
    - id: S3
      claim: the tumour minus own-adjacent-normal score difference is lower for patients with an MSI
             tumour than for the other patients with a normal (UCEC, STAD, COAD pooled)
      test: Mann-Whitney; scores computed in the main matrix with each project's tumours and normals
            ranked together (same construction as msi_cis, exons by the same rules)
      why: MSI is somatic; a patient-, hospital- or handling-level cause would also mark the normal
    - id: S4
      claim: the score rebuilt in the main SE matrix (tumours only, its own feature filter, same rules)
             is lower in MSI than in rest (AUROC > 0.5)
      test: Mann-Whitney
  exploratory: leave-one-site-out AUROC range; the MSI-patient normals' scores against the other
               normals; AUROC within the lower-immune half; Spearman of the score with stromal,
               immune and ri_mean within MSI and within rest
