# Conda environment used for every result in this repository (the existing env
# `survival_env_full`, shared with zachpwakefield/cancer-survival-predictions).
# Recreate: conda env create -f environment.yml
name: survival_env_full
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - pyarrow=23.0.1
  - scipy=1.15.3
  - scikit-learn=1.7.2
  - matplotlib=3.10.8
  - pyyaml
  - pip
  - pip:
      - torch==2.2.2
      - optuna==4.6.0
      - shap==0.48.0
